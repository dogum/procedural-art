name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON manifests and versions
        run: |
          set -euo pipefail
          for j in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do python3 -m json.tool "$j" > /dev/null && echo "ok $j"; done
          v1=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          v2=$(python3 -c 'import json;print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          [ "$v1" = "$v2" ] || { echo "plugin.json ($v1) and marketplace.json ($v2) differ"; exit 1; }
          for s in skills/*/SKILL.md; do grep -q "version: \"$v1\"" "$s" || { echo "$s metadata.version != $v1"; exit 1; }; done

      - name: Build the skill packages (frontmatter, references and dem.py checks)
        run: scripts/build-skills.sh dist

      - name: Web app (docs/app) is built from the current studio engine
        run: |
          set -euo pipefail
          python3 scripts/build-app.py
          if ! git diff --exit-code -- docs/app || [ -n "$(git status --porcelain -- docs/app)" ]; then
            echo "docs/app is out of date: run python scripts/build-app.py and commit the result"; exit 1
          fi

      - name: Validate plugin with Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - uses: actions/upload-artifact@v7
        with:
          name: skills
          path: dist/*.skill

  smoke:
    name: Render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Terrain art, every style (Fuji, real elevation, draft size)
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/skills/procedural-terrain-art/scripts/render.py" \
            --peak 35.3606,138.7274 --from 35.5100,138.7550 --style all --size 600x200 --quality 0.4 --out out/fuji/
      - name: Photographic terrain draft
        working-directory: ${{ runner.temp }}
        run: |
          S="$GITHUB_WORKSPACE/skills/procedural-realism/scripts"
          python "$S/pbr_terrain.py" --peak 35.3606,138.7274 --from 35.5100,138.7550 --size 300x100 --work work/fuji
          python "$S/post_terrain.py" --bands work/fuji/bands_300x100 --out out/fuji_pbr.png
      - name: Path tracer draft from a shipped scene
        working-directory: ${{ runner.temp }}
        run: |
          S="$GITHUB_WORKSPACE/skills/procedural-realism"
          python "$S/scripts/pathtracer.py" --scene "$S/scenes/prism_and_crystal.json" --size 300x100 --spp 2 --tag ci --work work/pt
          python "$S/scripts/post_pathtrace.py" --tag ci --work work/pt --out out/prism.png
      - name: Painterly finish
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/skills/procedural-realism/scripts/paint.py" --in out/fuji_pbr.png --out out/fuji_watercolor.png --style watercolor --size 600x200
      - name: A painting from imagination (shipped study, draft size)
        working-directory: ${{ runner.temp }}
        run: |
          SK="$GITHUB_WORKSPACE/skills/procedural-painting"
          python "$SK/studies/rain_at_blue_hour.py" --height 400 --out out/rain_at_blue_hour.png
          python "$SK/studies/harbour_at_first_light.py" --height 300 --out out/harbour.png --tape out/harbour.tape
          python "$SK/scripts/repaint.py" --in out/fuji_pbr.png --out out/fuji_repainted.png --height 300
      - name: One-file canvas pieces (self-contained, seeded, the template matches the gallery copy)
        run: |
          for f in docs/canvas/*.html skills/procedural-canvas/assets/*.html; do
            [ "$(basename "$f")" = index.html ] && continue
            grep -q "<canvas" "$f" || { echo "$f: no canvas"; exit 1; }
            if grep -Eq "Math\.random\(|<script[^>]+src=|<link[^>]+href=|<img |fetch\(|XMLHttpRequest|import\(" "$f"; then echo "$f: not self-contained or not seeded"; exit 1; fi
            grep -q "dataset.ready" "$f" || { echo "$f: no done flag"; exit 1; }
          done
          for f in skills/procedural-canvas/assets/*.html; do cmp "$f" "docs/canvas/$(basename "$f")"; done
          node --check skills/procedural-canvas/scripts/render_headless.js
      - name: The 3D stage (an interior with a figure; a path-tracer scene painted)
        working-directory: ${{ runner.temp }}
        run: |
          SK="$GITHUB_WORKSPACE/skills/procedural-painting"
          python "$SK/studies/the_letter.py" --height 300 --out out/the_letter.png
          python "$SK/studies/pomegranates_from_the_scene.py" --height 300 --out out/pomegranates_painted.png
          python "$SK/studies/the_white_cup.py" --height 300 --out out/the_white_cup.png
      - name: Watercolour (two studies on the second medium)
        working-directory: ${{ runner.temp }}
        run: |
          SK="$GITHUB_WORKSPACE/skills/procedural-painting"
          python "$SK/studies/estuary_in_watercolour.py" --height 400 --out out/estuary_wc.png
          python "$SK/studies/poppies_in_watercolour.py" --height 400 --out out/poppies_wc.png
          python "$SK/scripts/aquarelle_repaint.py" --in out/fuji_pbr.png --out out/fuji_wc.png --height 300
      - name: A moving painting (four frames of changing light, one set of strokes)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p work/seq
          python -c "from PIL import Image, ImageEnhance; im = Image.open('out/fuji_pbr.png').convert('RGB'); [ImageEnhance.Brightness(im).enhance(1 - 0.22 * i).save(f'work/seq/{i:03d}.png') for i in range(4)]"
          python "$GITHUB_WORKSPACE/skills/procedural-painting/scripts/motion.py" --frames work/seq --out out/moving.mp4 --keys 2 --jobs 2 --height 200 --tape out/moving.tape
          test -s out/moving.tape && test -s out/moving.tape.light.jpg
          test -f out/moving.mp4 || test -f out/moving_frames/00003.png      # no ffmpeg on the runner: frames kept
      - name: Painting in sittings (init, two sittings, resume, final, bundle)
        working-directory: ${{ runner.temp }}
        run: |
          S="$GITHUB_WORKSPACE/skills/procedural-painting/scripts"
          python "$S/sitting.py" work/sit --init 600x400 --palette "ultramarine, burnt sienna, titanium white"
          echo "study = lerp(rgb('cerulean'), rgb('naples yellow'), smoothstep(0.2, 0.8, y))" >> work/sit/study.py
          echo "p.strokes(np.ones_like(x), study, size=0.08, pickup=0)" > work/sit/10_lay_in.py
          python "$S/sitting.py" work/sit
          echo "p.dabs([(0.75, 0.5)], 'titanium white', size=0.05)" > work/sit/20_sun.py
          python "$S/sitting.py" work/sit | grep "resuming after 10_lay_in.py"
          python "$S/sitting.py" work/sit --final 300 --out out/sittings.png
          python "$S/sitting.py" work/sit --bundle work/sit_bundle.py
      - name: A real mountain painted by its ground (--aov)
        working-directory: ${{ runner.temp }}
        run: |
          R="$GITHUB_WORKSPACE/skills/procedural-realism/scripts"
          python "$R/pbr_terrain.py" --peak 35.3606,138.7274 --from 35.5100,138.7550 --size 300x100 --work work/fuji --tag aov --aov
          python "$R/post_terrain.py" --bands work/fuji/bands_300x100_aov --out out/fuji_aov.png
          python "$GITHUB_WORKSPACE/skills/procedural-painting/scripts/repaint.py" --in out/fuji_aov.png --aov work/fuji/bands_300x100_aov/aov --out out/fuji_aov_oil.png --height 300
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-renders
          path: ${{ runner.temp }}/out
