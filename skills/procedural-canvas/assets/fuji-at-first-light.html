<!--
  Fuji at first light: one HTML file, Canvas 2D and plain JavaScript. No assets, no network, no libraries.

  REAL
    - The ground. The block between DEM-BEGIN and DEM-END is elevation data for the land this camera sees
      (Terrarium tiles at about 30 m, resampled by skills/procedural-canvas/scripts/bake_dem.py). The far
      shore, the hills behind it and Mount Fuji are drawn from it as geometry in metres.
    - The viewpoint. 35.5222 N, 138.7650 E, on the north shore of Lake Kawaguchi, eye 2.2 m above the lake
      (829 m), looking 190.7 degrees (a little west of south) at the summit 18.2 km away. Focal length 2300 px
      for a 1920 px frame: a 45 degree horizontal field of view.
    - The Sun. 10 November 2026, 07:05 Japan time: azimuth 118.1, altitude 8.5 degrees, so it stands outside
      the frame to the left and a little ahead. It lights the east flank and leaves the west in shadow.
  INVENTED
    - The near bank with its stones, the pine and the maple, the pampas grass and the reeds.
    - The weather: the clouds, the mist on the water, how still the lake is, where the snow line sits.
    - What covers the land: forest, larch gold, bare scoria and snow are placed by height and slope, not surveyed.

  THE BAKED ELEVATION (DEM)
    Not a square map but the ground as this camera sees it: a fan of depth profiles.
      column i   a direction u = x / z = u0 + i (u1 - u0) / (nu - 1)        x right, z forward, metres
      row j      a distance z(j): z0 + a j while below z1; then z1 exp(k (j - j1)) while below z2; then z2 + b (j - j2)
      sample     ground height in metres above the lake, Earth curvature and refraction already taken off
    c16: every `step`-th sample both ways as unsigned 16-bit little-endian, metres = hmin + value * cq
    r8:  every sample as one byte, what is left after c16 is interpolated bilinearly, metres = (value - 128) * rq
    To paint another mountain: bake_dem.py --npz DEM.npz --camera lat,lon --look lat,lon --lake LEVEL --into this.html

  SEED    ?seed=anything (default kawaguchi-1107). The seed moves the weather and the foreground; the ground,
          the camera and the Sun never change.
  DONE    document.documentElement.dataset.ready = 'true' when the last stage has been drawn.
-->

// ---------------------------------------------------------------- the lake

function paintStones() {
  const r = rng('stones'), nS = makeNoise(rng('stoneform'));

  for (let i = 0; i < 9; i++) {                                      // standing in the shallows
    const x = 120 + r() * 1700, t = Math.pow(r(), 1.6), y = bankRow[x | 0] - 14 - t * 190;
    const z = F * EYE / (y - HY), s = (0.16 + 0.34 * r()) * F / z;

  }

    const x = 40 + r() * 1840, y = bankRow[x | 0] + 10 + Math.pow(r(), 1.4) * (H - bankRow[x | 0] - 20);
    const z = F * (EYE - 0.22) / (y - HY), s = (0.07 + 0.16 * r()) * F / z;

    const grey = 0.75 + 0.5 * nS(s.k, 3.3), brown = nS(s.k + 9, 1.1);
    // the long shadow of a low Sun (on the bank), or the dark mirror image (in the water)
    for (let y = Math.max(0, Math.floor(s.y - 2)); y < Math.min(H, s.y + s.h * 1.2 + 6); y++) for (let x = x0; x <= x1; x++) {
      let a = 0;
      if (!s.wet) {
        const ex = (x - (s.x + hw * 2.3)) / (hw * 2.9), ey = (y - (s.y + s.h * 0.10)) / (s.h * 0.30);
        a = 0.62 * sstep(1, 0.35, ex * ex + ey * ey);

        const px = (x - s.x) / hw + wob, ang = Math.atan2(py, px), rad = 1 + 0.16 * (nS(ang * 1.3 + s.k, 0.7) - 0.5) * 2;

// ---------------------------------------------------------------- from linear light to the screen
const LUT = new Uint8Array(4097);
for (let i = 0; i <= 4096; i++) { const c = i / 4096; LUT[i] = Math.round(255 * (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055)); }

// ---------------------------------------------------------------- the foreground drawn with strokes
const rgb = (r, g, b, a) => a === undefined ? `rgb(${r | 0},${g | 0},${b | 0})` : `rgba(${r | 0},${g | 0},${b | 0},${a})`;

// a limb: a centre line with a width, drawn as lengthwise strips so it is round, with bark that follows it.
// The Sun is low, ahead and to the left: wood facing us is in shade, and only the left edge catches the light.
const nBark = makeNoise(rng('bark'));

      const side = nx < 0 ? sm : -sm;                                // -1 = the edge on the Sun's side of the picture
      const round = Math.sqrt(1 - sm * sm * 0.75);
      // bark: long plates split by dark fissures, both running with the wood
      const across = sm * a[2] / bark.plate;
      const plate = nBark(run / (bark.plate * 3.4) + bark.seed, across + bark.seed * 3.1);
      const fis = sstep(0.34, 0.24, nBark(run / (bark.plate * 2.1) + 40 + bark.seed, across * 1.9 + 7)) * bark.fissure;
      const fine = nBark(run / 5 + 9, across * 5 + bark.seed);
      const shade = (0.20 + 0.30 * round) * (0.62 + 0.76 * plate) * (1 - 0.6 * fis) * (0.82 + 0.36 * fine);
      const rim = Math.pow(clamp((-side - 0.70) / 0.30, 0, 1), 1.4) * (0.55 + 0.9 * plate) * (1 - 0.5 * fis);   // low sunlight on the lit edge
      const cool = Math.pow(clamp((side - 0.62) / 0.38, 0, 1), 2) * 0.22;                                       // sky light on the other
      const up = bark.c2 ? sstep(bark.turn[0], bark.turn[1], run + (plate - 0.5) * 160) : 0;

function paintPine() {
  const r = rng('pine');
  const upper = { c: [126, 66, 42], plate: 16, seed: 3.7, fissure: 0.25, strips: 25 };   // a red pine: orange bark high up
  const lower = { c: [84, 62, 52], plate: 20, seed: 8.2, fissure: 0.3, strips: 29 };     // grey and deeply cut at the foot
  const bough = { c: [110, 60, 40], plate: 8, seed: 5.5, fissure: 0.2, strips: 9 };
  const j = () => (r() - 0.5);
  const trunk = curve([30 + j() * 24, 1100], [165 + j() * 30, 800], [200 + j() * 30, 470], [130 + j() * 40, -30], 70, 30, 200);
  const tufts = [], limbs = [], twigs = [];
  // boughs leave the trunk, sag and lift at the tip; twigs along them end in bursts of needles
  const starts = [[0.50, 1, 430], [0.58, -1, 170], [0.66, 1, 400], [0.76, 1, 320], [0.84, -1, 190], [0.92, 1, 280]];
  for (const [t, dir, len] of starts) {
    const p = trunk[Math.round(t * 200)], L = len * (0.85 + 0.3 * r());
    const end = [p[0] + dir * L, p[1] - 40 - 60 * r() + (dir > 0 ? 24 : 0)];
    const c = curve([p[0], p[1]], [p[0] + dir * L * 0.3, p[1] - 70 - 40 * r()], [p[0] + dir * L * 0.7, end[1] + 10 + 50 * r()], end, p[2] * 0.36, 2.5, 60);
    limbs.push(c);
    const n = Math.round(L / 5.5);
    for (let k = 0; k < n; k++) {
      const q = c[Math.min(60, Math.round((0.20 + 0.80 * Math.pow((k + r()) / n, 0.8)) * 60))];
      // a twig: up and outward, sometimes forked, with a burst at each end and one or two along it
      const tl = 12 + 50 * r() * (0.4 + r()), ta = -Math.PI / 2 + dir * (0.25 + 0.8 * r()) * (r() < 0.85 ? 1 : -1);
      const tx = q[0] + Math.cos(ta) * tl, ty = q[1] + Math.sin(ta) * tl;
      twigs.push([q[0], q[1], tx, ty, Math.max(0.8, q[2] * 0.4)]);
      tufts.push([tx, ty, r()]);
      if (r() < 0.6) tufts.push([mix(q[0], tx, 0.55) + j() * 8, mix(q[1], ty, 0.55) + j() * 6, r()]);
      if (r() < 0.5) { const fa = ta + (r() - 0.5) * 1.6, fl = tl * (0.4 + 0.5 * r()); twigs.push([tx, ty, tx + Math.cos(fa) * fl, ty + Math.sin(fa) * fl, 0.8]); tufts.push([tx + Math.cos(fa) * fl, ty + Math.sin(fa) * fl, r()]); }

  // the ones that reach up and to the left catch the Sun
  const burst = (x, y, k, pass) => {
    const n = 26, len = 15 + 9 * k;
    for (let m = 0; m < n; m++) {
      const an = -Math.PI / 2 + (r() - 0.5) * 4.6, l = len * (0.55 + 0.6 * r());
      const upL = clamp(-Math.sin(an) * 0.7 - Math.cos(an) * 0.6, 0, 1);

function paintMaple() {
  const r = rng('maple');
  const bark = { c: [70, 58, 54], plate: 3, seed: 21, fissure: 0.3, strips: 7 };
  const sprays = [];
  const grow = (x, y, ang, len, w, depth) => {
    const bend = (r() - 0.5) * 0.5, ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len + len * 0.06;

    limb(c, bark);

    if (depth >= 4 || w < 1.0) return;
    const kids = depth < 1 ? 2 : (r() < 0.55 ? 2 : 3);
    for (let k = 0; k < kids; k++) grow(ex, ey, ang + (k - (kids - 1) / 2) * (0.6 + 0.3 * r()) + (r() - 0.5) * 0.3, len * (0.62 + 0.2 * r()), w * 0.6, depth + 1);
  };

  grow(1975, 230, Math.PI * 1.03, 150, 7, 1);

    ctx.fillStyle = col; ctx.beginPath();

      const px = x + Math.cos(a) * s * lobe, py = y + Math.sin(a) * s * lobe * 0.85;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }

  };

  const leaves = [];
  for (const [sx, sy, ang, depth] of sprays) {
    const n = 4 + (r() * 6 | 0), glowSpray = r();
    for (let i = 0; i < n; i++) {
      const along = (r() - 0.3) * 62, drop = 4 + r() * 20;
      leaves.push([sx + Math.cos(ang) * along + (r() - 0.5) * 22, sy + Math.sin(ang) * along * 0.4 + drop, 6 + r() * 5.5, Math.PI / 2 + (r() - 0.5) * 1.6, r(), r() * 0.7 + glowSpray * 0.3]);
    }
  }

    let col;

    else if (depth < 0.8) col = rgb(152 + 50 * k, 34 + 26 * k, 20 + 10 * k);             // lit
    else col = k < 0.75 ? rgb(232 + 20 * k, 84 + 60 * k, 30 + 16 * k) : rgb(246, 160 + 30 * k, 56);   // sunlight through the leaf
    leaf(x, y, s, rot, col);
  }

function paintGrasses() {
  const r = rng('grass');
  ctx.lineCap = 'round';

    const cx = (g ? 1180 : 560) + (r() - 0.5) * 240, n = 14 + (r() * 12 | 0);
    for (let i = 0; i < n; i++) {
      const x = cx + (r() - 0.5) * 120 * (0.4 + r()), base = bankRow[clamp(x | 0, 0, W - 1)] - 3 - r() * 26;
      const z = F * EYE / (base - HY), hgt = (0.55 + 0.75 * r()) * F / z, lean = (r() - 0.5) * 0.22 + 0.05;

      ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + lean * hgt * 0.3 + kink, base - hgt * 0.55, topx, topy); ctx.stroke();
      if (r() < 0.6) {                                               // a seed head, nodding
        ctx.lineWidth = 2.2; ctx.strokeStyle = k < 0.5 ? rgb(170, 132, 84) : rgb(96, 72, 50);
        ctx.beginPath(); ctx.moveTo(topx, topy); ctx.quadraticCurveTo(topx + 3, topy - hgt * 0.06, topx + 7 + 6 * r(), topy - hgt * 0.02 + 4); ctx.stroke();
      }
    }
  }
  // dry turf along the bank
  for (let i = 0; i < 5200; i++) {
    const x = r() * W, yb = bankRow[x | 0], y = yb + 32 + Math.pow(r(), 0.75) * (H - yb - 20);
    if (y > H + 20) continue;
    const z = F * (EYE - 0.22) / (y - HY), hgt = (0.035 + 0.11 * r()) * F / z, lean = (r() - 0.5) * 0.9 + 0.2;
    const patch = fbm(nBank, x / 130 + 20, y / 40, 3), k = clamp(r() * 0.7 + (0.75 - patch) * 0.8 + sstep(520, 60, x) * 0.25, 0, 0.999);
    ctx.lineWidth = 0.9 + 0.8 * r();
    ctx.strokeStyle = k < 0.10 ? rgb(206, 170, 108) : k < 0.42 ? rgb(118 + 44 * r(), 94 + 34 * r(), 52) : k < 0.75 ? rgb(60 + 36 * r(), 62 + 30 * r(), 30) : rgb(30 + 22 * r(), 34 + 20 * r(), 20);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean * hgt * 0.3, y - hgt * 0.6, x + lean * hgt, y - hgt); ctx.stroke();
  }
  // pampas grass: arching blades and plumes that the low Sun lights from behind
  const clump = (cx, cy, scale, n) => {
    for (let i = 0; i < n * 5; i++) {
      const a = -Math.PI / 2 + (r() - 0.5) * 1.5, L = scale * (0.5 + 0.6 * r()), k = r();
      const ex = cx + Math.cos(a) * L * 0.9 + (r() - 0.5) * 30, ey = cy + Math.sin(a) * L * 0.75 + L * 0.28 * Math.abs(Math.cos(a)) * 1.2;
      ctx.lineWidth = 1 + 1.4 * r();
      ctx.strokeStyle = k < 0.3 ? rgb(196, 160, 96) : k < 0.7 ? rgb(120 + 40 * r(), 104 + 30 * r(), 52) : rgb(58, 62, 34);
      ctx.beginPath(); ctx.moveTo(cx + (r() - 0.5) * 26, cy); ctx.quadraticCurveTo(cx + Math.cos(a) * L * 0.5, cy + Math.sin(a) * L * 0.9, ex, ey); ctx.stroke();
    }
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (r() - 0.5) * 0.7 + 0.12, L = scale * (0.95 + 0.45 * r());
      const mx = cx + Math.cos(a) * L * 0.55, my = cy + Math.sin(a) * L * 0.6, ex = cx + Math.cos(a) * L + 16 * r(), ey = cy + Math.sin(a) * L;
      ctx.lineWidth = 1.5; ctx.strokeStyle = rgb(150, 126, 76);
      ctx.beginPath(); ctx.moveTo(cx + (r() - 0.5) * 18, cy); ctx.quadraticCurveTo(mx - 6, my, ex, ey); ctx.stroke();
      // the plume: fine hairs swept one way
      const pl = scale * (0.22 + 0.12 * r()), sweep = 0.5 + 0.5 * r();
      for (let hI = 0; hI < 70; hI++) {
        const t = r(), px = ex + (ex - mx) * 0.0 + Math.cos(a) * pl * t * 0.2 + t * pl * 0.42 * sweep, py = ey - pl * t * 0.15 + pl * t * t * 0.8;
        const hl = pl * (0.16 + 0.22 * (1 - t)) * (0.6 + 0.8 * r()), glow = r();
        ctx.lineWidth = 0.9;
        ctx.strokeStyle = glow < 0.55 ? rgb(252, 236, 200, 0.85) : glow < 0.85 ? rgb(226, 196, 150, 0.8) : rgb(150, 124, 90, 0.8);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + hl * (0.75 + 0.3 * r()), py + hl * (0.5 + 0.5 * r())); ctx.stroke();
      }
    }
  };
  const spots = [[1640, 1100, 300, 9], [1810, 1110, 380, 12], [1470, 1110, 210, 6], [640, 1108, 170, 5], [520, 1112, 130, 4]];
  for (const [x, y, s, n] of spots) clump(x + (r() - 0.5) * 60, y, s * (0.85 + 0.3 * r()), n);
  // a few wild asters low in the turf
  for (let i = 0; i < 30; i++) {
    const x = 620 + r() * 900, y = 1022 + r() * r() * 56, s = 2.4 + 2 * r();
    for (let p = 0; p < 9; p++) {
      const a = p * 0.698 + r() * 0.2;
      ctx.strokeStyle = rgb(206 + 30 * r(), 196 + 30 * r(), 232); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s * 0.6); ctx.stroke();
    }
    ctx.fillStyle = rgb(232, 190, 70); ctx.fillRect(x - 0.9, y - 0.7, 1.8, 1.4);
  }
}

function finish() {
  // the lens and the film: corners a little darker, a trace of grain
  const img = ctx.getImageData(0, 0, W, H), d = img.data, r = rng('grain');
  for (let y = 0, o = 0; y < H; y++) for (let x = 0; x < W; x++, o += 4) {
    const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2), v = 1 - 0.16 * Math.pow(dx * dx * 0.8 + dy * dy * 0.7, 1.4);
    const g = (r() - 0.5) * 5;
    d[o] = clamp(d[o] * v + g, 0, 255); d[o + 1] = clamp(d[o + 1] * v + g, 0, 255); d[o + 2] = clamp(d[o + 2] * v + g, 0, 255);
  }
  ctx.putImageData(img, 0, 0);
}

// ---------------------------------------------------------------- the stages, with a line of progress
const stages = [
  ['unpacking the ground', decodeGround],
  ['slopes and cast shadows', groundSlopesAndShadows],
  ['sky and cloud', paintSky],
  ['scanning the land, front to back', scanLand],
  ['lighting the land', shadeLand],
  ['mirroring the far shore', () => { layBank(); buildMirror(); }],
  ['the lake', paintWater],
  ['the near bank', () => { paintBank(); paintStones(); }],
  ['developing', develop],
  ['the pine', paintPine],
  ['the maple', paintMaple],
  ['reeds, turf and pampas grass', paintGrasses],
  ['finishing', finish],
];
(async () => {
  const t0 = performance.now();
  for (let i = 0; i < stages.length; i++) {
    lineEl.textContent = `${i + 1}/${stages.length}  ${stages[i][0]}`;
    await new Promise((res) => setTimeout(res, 0));                  // let the page show the line and what has been drawn
    try { stages[i][1](); } catch (err) { lineEl.textContent = `stage "${stages[i][0]}" failed: ${err.message}`; window.__renderError = String(err); throw err; }
    if (i >= 8) await new Promise((res) => setTimeout(res, 0));
  }
  lineEl.textContent = `${DEM.name} · seed ${SEED} · ${((performance.now() - t0) / 1000).toFixed(1)} s · try ?seed=another`;
  window.__renderDone = true;
  document.documentElement.dataset.ready = 'true';
})();
</script>
