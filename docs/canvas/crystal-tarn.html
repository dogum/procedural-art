<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawn over the Crystal Tarn — a procedural landscape</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b09;}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Georgia,"Times New Roman",serif;}
  #frame{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;box-shadow:0 0 80px rgba(0,0,0,.7);}
  canvas{display:block;width:100%;height:100%;background:#0d0b09;}
  #prog{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);text-align:center;color:#efe2c4;font-size:clamp(11px,1.1vw,15px);letter-spacing:.08em;text-shadow:0 1px 4px #000,0 0 12px #000;transition:opacity 1.4s;pointer-events:none;white-space:nowrap}
  #pbar{width:min(320px,40vw);height:2px;background:rgba(255,255,255,.18);margin:10px auto 0;overflow:hidden}
  #pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b98f45,#f6e2a8);transition:width .35s}
  #bar{position:absolute;right:12px;bottom:10px;display:flex;gap:8px;align-items:center;color:#eadfc6;font-size:12px;background:rgba(12,10,8,.55);padding:5px 6px 5px 10px;border-radius:3px;opacity:.0;transition:opacity .5s}
  #frame:hover #bar,#bar:focus-within{opacity:1}
  #bar button{font:inherit;color:#1a140c;background:#e2cf9e;border:0;border-radius:2px;padding:3px 9px;cursor:pointer}
  #bar button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="frame">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="prog"><div id="ptxt">Preparing the canvas…</div><div id="pbar"><i></i></div></div>
  <div id="bar"><span id="seedlbl"></span><button id="again" disabled>New seed</button></div>
</div>
<script>
/*
  Dawn over the Crystal Tarn
  ------------------------------------------------------------------
  Seed: ?seed=1234 or #seed-1234 (default 1847). Signals completion with
  document.documentElement.dataset.ready = 'true'.
  Every pixel below is computed from code: seeded PRNG, gradient (Perlin)
  noise, fBm / ridged multifractals, an analytic sunrise sky with Mie glow,
  perspective-projected clouds, shaded multifractal mountains with aerial
  perspective, recursive (fractal) trees with tens of thousands of leaves,
  per-pixel moss-covered rocks, a ripple-perturbed mirror lake with Fresnel,
  refraction and a pebbled lakebed, screen-space volumetric light shafts,
  particle systems, bloom and a painterly colour grade.
  No images, fonts, libraries or network access are used.
*/
(() => {
'use strict';
const W = 1920, H = 1080, Y0 = 640;            // Y0: far waterline
const SUN = { x: 1140, y: 404, r: 19 };
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let SEED = 1847, SEEDH = 0, N = null;

/* ====================================================================
   Utilities
   ==================================================================== */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgbs = (c, a) => a === undefined
  ? `rgb(${clamp(c[0],0,255)|0},${clamp(c[1],0,255)|0},${clamp(c[2],0,255)|0})`
  : `rgba(${clamp(c[0],0,255)|0},${clamp(c[1],0,255)|0},${clamp(c[2],0,255)|0},${a.toFixed(3)})`;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function g2(c, read) { return c.getContext('2d', read ? { willReadFrequently: true } : undefined); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------- seeded randomness ---------- */
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeRng(name) {
  const f = mulberry32(hashStr(SEED + '/' + name));
  const r = () => f();
  r.range = (a, b) => a + (b - a) * f();
  r.gauss = () => { let u = f(); if (u < 1e-9) u = 1e-9; return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * f()); };
  r.pick = a => a[(f() * a.length) | 0];
  return r;
}
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + SEEDH) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

/* ---------- gradient noise, fBm, ridged multifractal ---------- */
function makeNoise(rng) {
  const p = new Uint8Array(512), gx = new Float32Array(256), gy = new Float32Array(256), perm = new Uint8Array(256);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = rng() * Math.PI * 2; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  function n2(x, y) {
    let xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi; xi &= 255; yi &= 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const a = p[xi] + yi, b = p[xi + 1] + yi;
    const aa = p[a], ab = p[a + 1], ba = p[b], bb = p[b + 1];
    const n00 = gx[aa] * xf + gy[aa] * yf, n10 = gx[ba] * (xf - 1) + gy[ba] * yf;
    const n01 = gx[ab] * xf + gy[ab] * (yf - 1), n11 = gx[bb] * (xf - 1) + gy[bb] * (yf - 1);
    const x0 = n00 + u * (n10 - n00), x1 = n01 + u * (n11 - n01);
    return (x0 + v * (x1 - x0)) * 1.41;
  }
  function fbm(x, y, oct) {
    let s = 0, a = 0.5, nrm = 0;
    for (let i = 0; i < oct; i++) {
      s += a * n2(x + i * 17.13, y - i * 9.71); nrm += a; a *= 0.5;
      // rotate + scale each octave to break grid alignment
      const nx = (x * 0.8 - y * 0.6) * 2.02, ny = (x * 0.6 + y * 0.8) * 2.02; x = nx; y = ny;
    }
    return s / nrm;
  }
  function ridged(x, y, oct) {
    let s = 0, a = 0.5, f = 1, w = 1, nrm = 0;
    for (let i = 0; i < oct; i++) {
      let n = 1 - Math.abs(n2(x * f + i * 31.7, y * f + i * 11.3)); n *= n; n *= w;
      w = n * 1.7; if (w > 1) w = 1;
      s += n * a; nrm += a; a *= 0.5; f *= 2.03;
    }
    return s / nrm;
  }
  return { n2, fbm, ridged };
}

/* ====================================================================
   Sky model: vertical Rayleigh-like gradient + Mie forward-scatter halo
   ==================================================================== */
const SUNC = [1.0, 0.83, 0.56];
function sky(x, y, o) {
  const e = clamp((Y0 - y) / Y0, 0, 1);
  const dx = (x - SUN.x) / W, warm = Math.exp(-dx * dx * 6.5);
  const hr = mix(0.93, 1.00, warm), hg = mix(0.69, 0.80, warm), hb = mix(0.66, 0.53, warm);
  const mr = mix(0.63, 0.88, warm), mg = mix(0.60, 0.71, warm), mb = mix(0.77, 0.64, warm);
  const t1 = sstep(0, 0.45, e), t2 = sstep(0.30, 1, e);
  const r = mix(mix(hr, mr, t1), 0.24, t2), g = mix(mix(hg, mg, t1), 0.36, t2), b = mix(mix(hb, mb, t1), 0.62, t2);
  const ddx = x - SUN.x, ddy = (y - SUN.y) * 1.12, d = Math.sqrt(ddx * ddx + ddy * ddy);
  const m = 0.95 * Math.exp(-d / 26) + 0.34 * Math.exp(-d / 95) + 0.17 * Math.exp(-d / 330) + 0.07 * Math.exp(-d / 1000);
  o[0] = r + SUNC[0] * m; o[1] = g + SUNC[1] * m; o[2] = b + SUNC[2] * m; o[3] = m;
}

/* perspective cloud deck */
let CLOUD_O = 0;
function cloudDen(x, y) {
  const q = Y0 + 70 - y; if (q < 82) return 0;
  const e = (Y0 - y) / Y0;
  let u = (x - W * 0.5) / q * 3.0 + CLOUD_O, v = 2600 / q * 2.4;
  const wx = N.fbm(u * 0.35 + 3.1, v * 0.35 - 1.7, 3), wy = N.fbm(u * 0.35 - 5.2, v * 0.35 + 2.3, 3);
  u += wx * 1.5; v += wy * 1.1;
  const n = N.fbm(u, v * 1.0, 6) * 0.62 + 0.5;
  const cov = 0.58 - 0.14 * sstep(0.2, 0.85, e);
  let d = sstep(cov, cov + 0.22, n);
  const ds = Math.hypot(x - SUN.x, (y - SUN.y) * 1.2);
  d *= sstep(26, 80, ds) * sstep(0.05, 0.22, e);
  return d;
}
function computeClouds() {
  const cw = W / 2, ch = Y0 / 2, out = new Float32Array(cw * ch * 4);
  for (let j = 0; j < ch; j++) {
    const y = j * 2 + 1, e = clamp((Y0 - y) / Y0, 0, 1);
    for (let i = 0; i < cw; i++) {
      const x = i * 2 + 1, k = (j * cw + i) * 4;
      const d = cloudDen(x, y);
      if (d <= 0.002) continue;
      let ux = SUN.x - x, uy = SUN.y - y; const dl = Math.sqrt(ux * ux + uy * uy) + 1e-3; ux /= dl; uy /= dl;
      const d2 = cloudDen(x + ux * 18, y + uy * 18);
      const lit = clamp(0.5 + (d - d2) * 2.4, 0, 1);
      const dxw = (x - SUN.x) / W, warm = Math.exp(-dxw * dxw * 6);
      const sr = mix(0.46, 0.74, 1 - e), sg = mix(0.44, 0.55, 1 - e), sb = mix(0.60, 0.57, 1 - e);
      const lr = 1.0, lg = mix(0.66, 0.84, warm), lb = mix(0.62, 0.55, warm);
      const lf = lit * (0.55 + 0.45 * (1 - e));
      let r = mix(sr, lr, lf), g = mix(sg, lg, lf), b = mix(sb, lb, lf);
      const sil = Math.exp(-dl / 260) * (1 - d) * 1.6 * (0.3 + 0.7 * lit);
      r += sil; g += sil * 0.86; b += sil * 0.62;
      out[k] = r; out[k + 1] = g; out[k + 2] = b; out[k + 3] = d * 0.94;
    }
  }
  return out;
}

/* ====================================================================
   Mountains
   ==================================================================== */
function profile(x, base, peaks, jag, o) {
  let hm = 0, hs = 0;
  for (const p of peaks) { const t = Math.abs(x - p[0]) / p[2]; if (t < 1) { const v = p[1] * Math.pow(1 - t, 1.3); hs += v; if (v > hm) hm = v; } }
  let h = hm + 0.3 * (hs - hm);
  const k = 0.45 + h / 300;
  h += jag * k * ((N.ridged(x * 0.0065 + o, o * 0.37, 6) - 0.42) * 2.2 + 0.35 * N.fbm(x * 0.035 + o, o + 2.1, 3));
  return base - h;
}
const AMB = [0.52, 0.60, 0.86], SUNL = [1.0, 0.76, 0.52];
function shadeMountain(L, x, y, sk, fg, o) {
  const rr = L.ridge, dd = y - rr[x];
  const w = Math.min(70, (5 + dd * 0.3) | 0), xa = x - w < 0 ? 0 : x - w, xb = x + w > W - 1 ? W - 1 : x + w;
  const slope = (rr[xb] - rr[xa]) / (xb - xa);
  const sk2 = clamp(L.fall[x] * 0.6, -0.7, 0.7), xf = x - dd * sk2;
  const u = xf * L.fx + L.o, v = y * L.fy + L.o * 0.7;
  let h0, gx, gy;
  if (L.forest) { h0 = N.fbm(u, v, 4); const hx = N.fbm(u + 0.06, v, 4), hy = N.fbm(u, v + 0.06, 4); gx = (hx - h0) / 0.06; gy = (hy - h0) / 0.06; }
  else { h0 = N.ridged(u, v, 6); const hx = N.ridged(u + 0.025, v, 6), hy = N.ridged(u, v + 0.025, 6); gx = (hx - h0) / 0.025; gy = (hy - h0) / 0.025; }
  let nx = clamp(slope * 1.3, -1.3, 1.3) - gx * L.bump, ny = 0.3 + gy * L.bump * 0.7, nz = 1;
  const inv = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz); nx *= inv; ny *= inv; nz *= inv;
  const s = clamp((SUN.x - x) / 220, -1, 1);
  let dif = nx * s * 0.86 + ny * 0.40 - nz * 0.30; if (dif < 0) dif = 0;
  const amb = 0.40 + 0.40 * ny;
  const tv = 0.75 + 0.5 * (N.fbm(xf * 0.03 + L.o, y * 0.008, 3) * 0.5 + 0.5);
  let ar = L.rock[0] * tv, ag = L.rock[1] * tv, ab = L.rock[2] * tv;
  if (L.forest) { const c = 0.65 + 0.7 * (h0 * 0.5 + 0.5); ar *= c; ag *= c; ab *= c; }
  if (L.snow > 0) {
    const gul = N.ridged(xf * 0.026 + L.o + N.fbm(x * 0.008, y * 0.004, 2) * 0.6, y * 0.006, 4);
    const sc = (1 - dd / L.snow) * 0.9 + (gul - 0.45) * 0.9 + (h0 - 0.42) * 0.5 + N.fbm(xf * 0.02 + L.o, y * 0.007, 3) * 0.3 - Math.abs(slope) * 0.22;
    const sm = sstep(0.33, 0.50, sc);
    ar = mix(ar, 0.90, sm); ag = mix(ag, 0.93, sm); ab = mix(ab, 0.99, sm);
  }
  let r = ar * (AMB[0] * amb + SUNL[0] * dif * 1.8);
  let g = ag * (AMB[1] * amb + SUNL[1] * dif * 1.8);
  let b = ab * (AMB[2] * amb + SUNL[2] * dif * 1.8);
  const rim = Math.exp(-dd / 1.7) * (0.25 + 1.9 * Math.exp(-Math.abs(x - SUN.x) / 230)) * L.rimK;
  r += SUNL[0] * rim; g += SUNL[1] * rim; b += SUNL[2] * rim;
  // aerial perspective (inscattering toward the sky colour, which already carries the Mie halo)
  const mk2 = sk[3] * 0.7;
  r = mix(r, (sk[0] - SUNC[0] * mk2) * 0.95, L.haze); g = mix(g, (sk[1] - SUNC[1] * mk2) * 0.95, L.haze); b = mix(b, (sk[2] - SUNC[2] * mk2) * 0.98, L.haze);
  // valley fog pooling at the foot of each range
  const f = sstep(L.base - L.fogH, L.base + 4, y) * (0.40 + 0.60 * (N.fbm(x * 0.0035 + L.o, y * 0.03, 4) * 0.5 + 0.5)) * L.fogK;
  o[0] = mix(r, fg[0], f); o[1] = mix(g, fg[1], f); o[2] = mix(b, fg[2], f);
}

function renderSkyMountains(gA, clouds, srcMask, layers) {
  const rows = Y0 + 6;
  const img = gA.createImageData(W, rows), d = img.data;
  const sc = [0, 0, 0, 0], mc = [0, 0, 0], skc = [0, 0, 0, 0], fgc = [0, 0, 0];
  const cw = W / 2, ch = Y0 / 2;
  const fog = new Float32Array(W * 3);
  for (let x = 0; x < W; x++) { sky(x, Y0 - 26, sc); const m = sc[3] * 0.45; fog[x * 3] = (sc[0] - SUNC[0] * m) * 1.02; fog[x * 3 + 1] = sc[1] - SUNC[1] * m; fog[x * 3 + 2] = sc[2] - SUNC[2] * m; }
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < W; x++) {
      sky(x, y, sc);
      let r = sc[0], g = sc[1], b = sc[2]; const mie = sc[3];
      skc[0] = r; skc[1] = g; skc[2] = b; skc[3] = mie;
      const ddx = x - SUN.x, ddy = y - SUN.y, dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd < SUN.r + 1.5) {
        const a = clamp(SUN.r + 0.5 - dd, 0, 1);
        const limb = 0.80 + 0.20 * Math.sqrt(Math.max(0, 1 - (dd / SUN.r) * (dd / SUN.r)));
        r = mix(r, 2.0 * limb, a); g = mix(g, 1.85 * limb, a); b = mix(b, 1.55 * limb, a);
      }
      let ca = 0;
      if (y < Y0 - 6) {
        let fx = x * 0.5 - 0.5, fy = y * 0.5 - 0.5;
        if (fx < 0) fx = 0; if (fx > cw - 1.001) fx = cw - 1.001; if (fy < 0) fy = 0; if (fy > ch - 1.001) fy = ch - 1.001;
        const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
        const i00 = (y0 * cw + x0) * 4, i10 = i00 + 4, i01 = i00 + cw * 4, i11 = i01 + 4;
        const a00 = clouds[i00 + 3], a10 = clouds[i10 + 3], a01 = clouds[i01 + 3], a11 = clouds[i11 + 3];
        ca = (a00 * (1 - tx) + a10 * tx) * (1 - ty) + (a01 * (1 - tx) + a11 * tx) * ty;
        if (ca > 0.001) {
          // premultiplied bilinear
          const w00 = (1 - tx) * (1 - ty) * a00, w10 = tx * (1 - ty) * a10, w01 = (1 - tx) * ty * a01, w11 = tx * ty * a11, ws = w00 + w10 + w01 + w11;
          const cr = (clouds[i00] * w00 + clouds[i10] * w10 + clouds[i01] * w01 + clouds[i11] * w11) / ws;
          const cg = (clouds[i00 + 1] * w00 + clouds[i10 + 1] * w10 + clouds[i01 + 1] * w01 + clouds[i11 + 1] * w11) / ws;
          const cb = (clouds[i00 + 2] * w00 + clouds[i10 + 2] * w10 + clouds[i01 + 2] * w01 + clouds[i11 + 2] * w11) / ws;
          r = mix(r, cr, ca); g = mix(g, cg, ca); b = mix(b, cb, ca);
        }
      }
      let vis = 1;
      for (let li = 0; li < layers.length; li++) {
        const L = layers[li], rr = L.ridge[x];
        if (y < rr - 1) continue;
        let covered = false;
        for (let lj = li + 1; lj < layers.length; lj++) if (y > layers[lj].ridge[x] + 1) { covered = true; break; }
        if (covered) continue;
        const a = clamp(y - rr + 0.5, 0, 1);
        fgc[0] = fog[x * 3]; fgc[1] = fog[x * 3 + 1]; fgc[2] = fog[x * 3 + 2];
        shadeMountain(L, x, y, skc, fgc, mc);
        r = mix(r, mc[0], a); g = mix(g, mc[1], a); b = mix(b, mc[2], a);
        vis *= 1 - a;
      }
      if (y < Y0) srcMask[y * W + x] = vis * (1 - ca * 0.9) * (Math.pow(mie, 1.6) + 0.015);
      const k = (y * W + x) * 4;
      d[k] = r * 255; d[k + 1] = g * 255; d[k + 2] = b * 255; d[k + 3] = 255;
    }
  }
  gA.putImageData(img, 0, 0);
}

/* simple conifer silhouette (used for distant & mid-ground forests) */
function drawConifer(g, x, yb, h, w, dark, lit, sunSide, rng, rim) {
  const tiers = Math.max(5, Math.min(24, Math.round(h / 4.5)));
  const top = yb - h;
  const R = [], Lp = [];
  for (let i = 1; i <= tiers; i++) {
    const f = i / tiers, ty = top + h * 0.95 * f;
    const tw = w * Math.pow(f, 0.85) * (0.7 + 0.5 * rng());
    const tw2 = w * Math.pow(f, 0.85) * (0.7 + 0.5 * rng());
    const droop = h * 0.02 * (1 + rng());
    const step = h / tiers;
    R.push([x + tw, ty + droop], [x + tw * 0.32, ty + droop * 0.3 + step * 0.45]);
    Lp.push([x - tw2, ty + droop], [x - tw2 * 0.32, ty + droop * 0.3 + step * 0.45]);
  }
  g.beginPath(); g.moveTo(x, top - h * 0.03);
  for (const p of R) g.lineTo(p[0], p[1]);
  g.lineTo(x + w * 0.12, yb + 2); g.lineTo(x - w * 0.12, yb + 2);
  for (let i = Lp.length - 1; i >= 0; i--) g.lineTo(Lp[i][0], Lp[i][1]);
  g.closePath();
  const gr = g.createLinearGradient(x - w, 0, x + w, 0);
  const A = sunSide > 0 ? dark : mix3(dark, lit, 0.45), B = sunSide > 0 ? mix3(dark, lit, 0.45) : dark;
  gr.addColorStop(0, rgbs(A)); gr.addColorStop(0.5, rgbs(dark)); gr.addColorStop(1, rgbs(B));
  g.fillStyle = gr; g.fill();
  if (rim > 0.01) {
    const side = sunSide > 0 ? R : Lp;
    g.beginPath(); g.moveTo(x, top - h * 0.03);
    for (const p of side) g.lineTo(p[0], p[1]);
    g.strokeStyle = rgbs(lit, rim); g.lineWidth = Math.max(0.8, h / 40); g.stroke();
  }
}

/* ====================================================================
   Mid-ground forested banks (with a waterfall)
   ==================================================================== */
const TIPL = 790, TIPR = 1290, WFX = 1432;
function ridgeL(x) { const t = x / TIPL; return 365 + (Y0 + 30 - 365) * Math.pow(t, 1.55) + 18 * N.fbm(x * 0.006, 41.2, 4) + 6 * N.fbm(x * 0.03, 12.1, 2); }

}

/* ====================================================================
   Blur / post helpers
   ==================================================================== */
function boxBlur3(src, w, h, r) {
  const tmp = new Float32Array(src.length);
  const pass = (a, b, horiz) => {
    const n = horiz ? w : h, m = horiz ? h : w, inv = 1 / (2 * r + 1);
    for (let j = 0; j < m; j++) for (let c = 0; c < 3; c++) {
      let acc = 0;
      const idx = i => (horiz ? (j * w + i) : (i * w + j)) * 3 + c;
      for (let i = -r; i <= r; i++) acc += a[idx(clamp(i, 0, n - 1))];
      for (let i = 0; i < n; i++) {
        b[idx(i)] = acc * inv;
        acc += a[idx(Math.min(n - 1, i + r + 1))] - a[idx(Math.max(0, i - r))];
      }
    }
  };
  for (let it = 0; it < 3; it++) { pass(src, tmp, true); pass(tmp, src, false); }
  return src;
}
function sampleBuf3(buf, bw, bh, fx, fy, o) {
  fx = clamp(fx, 0, bw - 1.001); fy = clamp(fy, 0, bh - 1.001);
  const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
  const i00 = (y0 * bw + x0) * 3, i10 = i00 + 3, i01 = i00 + bw * 3, i11 = i01 + 3;
  for (let c = 0; c < 3; c++) {
    const a = buf[i00 + c] + (buf[i10 + c] - buf[i00 + c]) * tx, b = buf[i01 + c] + (buf[i11 + c] - buf[i01 + c]) * tx;
    o[c] = a + (b - a) * ty;
  }
}
function sampleBuf1(buf, bw, bh, fx, fy) {
  fx = clamp(fx, 0, bw - 1.001); fy = clamp(fy, 0, bh - 1.001);
  const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0, i = y0 * bw + x0;
  const a = buf[i] + (buf[i + 1] - buf[i]) * tx, b = buf[i + bw] + (buf[i + bw + 1] - buf[i + bw]) * tx;
  return a + (b - a) * ty;
}

    });
    const rng = makeRng('flora');
    const inBank = (x, y) => y > gLa[x | 0] + 3 || y > gRa[x | 0] + 3;
    const depOf = (x, y) => Math.max(y - gLa[x | 0], y - gRa[x | 0]);
    // ferns
    const fernSpots = [[160, 944], [388, 980], [524, 1036], [52, 886], [700, 1080], [1566, 1004], [1726, 968], [1896, 1012], [1452, 1082], [470, 905], [1810, 1080]];
    for (const [fx, fy] of fernSpots) {
      const nf = 4 + (rng() * 4 | 0), sc = 0.8 + (fy - 880) / 300;
      for (let k = 0; k < nf; k++) {
        const ang = -Math.PI / 2 + rng.range(-1.2, 1.2), len = rng.range(45, 105) * sc, curl = (ang + Math.PI / 2) * 0.9 + rng.gauss() * 0.2;
        const yy = fy + rng.range(-4, 4), xx = fx + rng.range(-8, 8);
        items.push([yy, g => drawFern(g, rng, xx, yy, len, ang, curl, xx < SUN.x ? 1 : -1)]);
      }
    }
    // grass
    for (let i = 0; i < 7000; i++) {
      const x = rng() < 0.6 ? rng() * 880 : 1380 + rng() * 540;
      const g0 = Math.min(gLa[x | 0], gRa[x | 0]); if (g0 > H) continue;
      const y = g0 - 4 + Math.pow(rng(), 1.4) * (H + 10 - g0);
      if (!inBank(x, y + 4)) continue;
      const dep = depOf(x, y);
      if (rng() > 0.30 + 0.70 * Math.exp(-dep / 80)) continue;
      const h = rng.range(10, 30) * (0.7 + (y - 760) / 320 * 1.3) * (rng() < 0.1 ? 1.7 : 1);
      const lean = rng.gauss() * 0.32 + 0.06, w = rng.range(0.8, 1.8) * (0.8 + (y - 760) / 400);
      const back = Math.exp(-dep / 70) * (0.5 + 0.5 * rng());
      const tip = back > 0.45 ? mix3([150, 150, 60], [236, 204, 120], rng()) : mix3([70, 96, 32], [140, 150, 58], rng());
      const base = mix3([16, 26, 10], [40, 56, 20], rng());
      const c0 = rgbs(base), c1 = rgbs(tip);
      items.push([y, g => drawBlade(g, x, y, h, lean, w, c0, c1)]);
    }
    // flowers in drifts
    const drifts = [[120, 900, 'star'], [330, 940, 'gold'], [560, 960, 'blue'], [690, 1040, 'pink'], [200, 1050, 'fae'], [460, 1010, 'lupine'],
      [1500, 1020, 'gold'], [1660, 960, 'star'], [1820, 940, 'blue'], [1700, 1060, 'fae'], [1900, 870, 'pink'], [1560, 1074, 'star'], [70, 820, 'blue'], [380, 860, 'star']];
    const types = Object.keys(FLOWER);
    for (const [dx, dy, ty] of drifts) {
      const n = 18 + (rng() * 18 | 0);
      for (let k = 0; k < n; k++) {
        const x = dx + rng.gauss() * 55, y = dy + rng.gauss() * 26;
        if (!inBank(x, y) || x < 2 || x > W - 2) continue;
        const type = rng() < 0.8 ? ty : rng.pick(types);
        const s = rng.range(2.4, 4.4) * (0.7 + (y - 800) / 280);
        items.push([y, g => drawFlower(g, rng, x, y, s, type, glows)]);
      }
    }
    // mushrooms among the oak roots
    for (let k = 0; k < 11; k++) {
      const x = rng.range(130, 400), y = rng.range(950, 1010), s = rng.range(4, 9);
      if (!inBank(x, y)) continue;
      items.push([y, g => drawMushroom(g, rng, x, y, s, glows)]);
    }
  }
  items.sort((a, b) => a[0] - b[0]);
  for (const it of items) it[1](gC);
  log('flora (' + items.length + ' items)');

  ctx.drawImage(C, 0, 0);

  /* ---- 6. light: shafts, glows, particles ---- */
  await stage('Letting the light through…');
  const RW = 480, RH = 270;
  const mask = new Float32Array(RW * RH);
  for (let j = 0; j < RH; j++) for (let i = 0; i < RW; i++) {
    let s = 0;
    for (let yy = 0; yy < 4; yy++) { const y = j * 4 + yy; if (y >= Y0) continue; for (let xx = 0; xx < 4; xx++) s += srcMask[y * W + i * 4 + xx]; }
    mask[j * RW + i] = s / 16;
  }
  {
    const oc = mk(RW, RH), og = g2(oc, true); og.imageSmoothingQuality = 'high';
    og.drawImage(B, 0, 0, RW, RH); og.drawImage(C, 0, 0, RW, RH);
    const od = og.getImageData(0, 0, RW, RH).data;
    for (let i = 0; i < RW * RH; i++) mask[i] *= 1 - od[i * 4 + 3] / 255;
  }
  const rays = new Float32Array(RW * RH);
  {
    const sx = SUN.x / 4, sy = SUN.y / 4, NS = 110, dens = 0.98, decay = 0.978;
    for (let j = 0; j < RH; j++) for (let i = 0; i < RW; i++) {
      const dx = (sx - i) * dens / NS, dy = (sy - j) * dens / NS;
      let x = i, y = j, ill = 1, s = 0;
      for (let k = 0; k < NS; k++) { x += dx; y += dy; const xi = x | 0, yi = y | 0; s += mask[yi * RW + xi] * ill; ill *= decay; }
      const air = j * 4 > Y0 ? 0.55 : 1;
      const th = Math.atan2(j - sy, i - sx);
      const streak = 0.35 + 1.25 * sstep(0.32, 0.74, N.fbm(th * 10 + 2.3, 1.7, 3) * 0.5 + 0.5);
      rays[j * RW + i] = Math.min(0.9, s * 0.026 * air * streak);
    }
  }
  log('god rays');

  // glows of flowers and fungi
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, c, k] of glows) {
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rgbs(c, 0.30 * k)); gr.addColorStop(0.35, rgbs(c, 0.10 * k)); gr.addColorStop(1, rgbs(c, 0));
    ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // fireflies & drifting sparks
  {
    const rng = makeRng('fireflies');
    for (let i = 0; i < 38; i++) {
      let x, y;
      if (rng() < 0.6) { x = rng() < 0.6 ? rng() * 820 : 1400 + rng() * 520; y = rng.range(760, 1060); }
      else { x = rng.range(300, 1700); y = rng.range(650, 900); }
      const r = rng.range(3, 8), c = rng() < 0.7 ? [255, 214, 120] : [170, 255, 200];
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rgbs(c, 0.7)); gr.addColorStop(0.18, rgbs(c, 0.3)); gr.addColorStop(1, rgbs(c, 0));
      ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      if (y > 700 && y < 900 && x > 300 && x < 1700) { // faint reflection
        const ry = y + rng.range(20, 60); const g3 = ctx.createRadialGradient(x, ry, 0, x, ry, r * 0.6);
        g3.addColorStop(0, rgbs(c, 0.25)); g3.addColorStop(1, rgbs(c, 0)); ctx.fillStyle = g3; ctx.fillRect(x - r, ry - r, r * 2, r * 2);
      }
    }
    // dust motes & pollen suspended in the light shafts
    let drawn = 0;
    for (let i = 0; i < 9000 && drawn < 2600; i++) {
      const x = rng() * W, y = rng() * H * 0.96;
      const rv = sampleBuf1(rays, RW, RH, x / 4, y / 4);
      if (rng() > rv * 1.6 + 0.02) continue;
      drawn++;
      const r = rng.range(0.5, 1.7), a = clamp(rv * 1.4, 0.06, 0.75) * rng.range(0.35, 1);
      ctx.fillStyle = `rgba(255,${(214 + rng() * 30) | 0},${(150 + rng() * 60) | 0},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    }
  }
  ctx.restore();
  log('particles');

  /* ---- 7. post-processing: bloom, shafts, grade ---- */
  await stage('Varnishing the canvas…');
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const BW = 480, BH = 270, b1 = new Float32Array(BW * BH * 3);
  for (let j = 0; j < BH; j++) for (let i = 0; i < BW; i++) {
    let r = 0, g = 0, b = 0;
    for (let yy = 0; yy < 4; yy++) for (let xx = 0; xx < 4; xx++) {
      const k = ((j * 4 + yy) * W + i * 4 + xx) * 4;
      const R = d[k] / 255, G = d[k + 1] / 255, Bc = d[k + 2] / 255;
      const l = 0.3 * R + 0.59 * G + 0.11 * Bc, w = Math.max(0, l - 0.76) / 0.24;
      r += R * w; g += G * w; b += Bc * w;
    }
    const o = (j * BW + i) * 3; b1[o] = r / 16; b1[o + 1] = g / 16; b1[o + 2] = b / 16;
  }
  const CWb = 240, CHb = 135, b2 = new Float32Array(CWb * CHb * 3);
  for (let j = 0; j < CHb; j++) for (let i = 0; i < CWb; i++) for (let c = 0; c < 3; c++) {
    b2[(j * CWb + i) * 3 + c] = (b1[((j * 2) * BW + i * 2) * 3 + c] + b1[((j * 2) * BW + i * 2 + 1) * 3 + c] + b1[((j * 2 + 1) * BW + i * 2) * 3 + c] + b1[((j * 2 + 1) * BW + i * 2 + 1) * 3 + c]) / 4;
  }
  boxBlur3(b1, BW, BH, 3); boxBlur3(b2, CWb, CHb, 7);
  log('bloom');
  const s1 = [0, 0, 0], s2 = [0, 0, 0];
  const RC = [1.0, 0.80, 0.52];
  for (let y = 0; y < H; y++) {
    const vy = (y / H - 0.5) * 2;
    for (let x = 0; x < W; x++) {
      const k = (y * W + x) * 4;
      let r = d[k] / 255, g = d[k + 1] / 255, b = d[k + 2] / 255;
      sampleBuf3(b1, BW, BH, x / 4 - 0.5, y / 4 - 0.5, s1); sampleBuf3(b2, CWb, CHb, x / 8 - 0.5, y / 8 - 0.5, s2);
      r += s1[0] * 0.40 + s2[0] * 0.55; g += s1[1] * 0.40 + s2[1] * 0.55; b += s1[2] * 0.40 + s2[2] * 0.55;
      const ry = Math.min(1.2, sampleBuf1(rays, RW, RH, x / 4 - 0.5, y / 4 - 0.5));
      { const er = Math.max(0, r - 1), eg = Math.max(0, g - 1), eb = Math.max(0, b - 1);
        r = 1 - (1 - Math.min(r, 1)) * (1 - Math.min(0.92, ry * RC[0])) + er * 0.6;
        g = 1 - (1 - Math.min(g, 1)) * (1 - Math.min(0.92, ry * RC[1])) + eg * 0.6;
        b = 1 - (1 - Math.min(b, 1)) * (1 - Math.min(0.92, ry * RC[2])) + eb * 0.6; }
      // highlight shoulder
      r = r < 0.78 ? r : 0.78 + 0.22 * (1 - Math.exp(-(r - 0.78) / 0.22));
      g = g < 0.78 ? g : 0.78 + 0.22 * (1 - Math.exp(-(g - 0.78) / 0.22));
      b = b < 0.78 ? b : 0.78 + 0.22 * (1 - Math.exp(-(b - 0.78) / 0.22));
      // gentle S-curve
      r = r * 0.84 + r * r * (3 - 2 * r) * 0.16; g = g * 0.84 + g * g * (3 - 2 * g) * 0.16; b = b * 0.84 + b * b * (3 - 2 * b) * 0.16;
      // split tone: umber shadows, golden highlights (old varnish)
      const l = 0.3 * r + 0.59 * g + 0.11 * b, ws = (1 - l) * (1 - l), hs = l * l;
      r += 0.022 * ws + 0.030 * hs; g += 0.008 * ws + 0.012 * hs; b += -0.010 * ws - 0.035 * hs;
      // saturation
      const l2 = 0.3 * r + 0.59 * g + 0.11 * b;
      r = l2 + (r - l2) * 1.07; g = l2 + (g - l2) * 1.07; b = l2 + (b - l2) * 1.07;
      // vignette
      const vx = (x / W - 0.5) * 2, v = vx * vx * 0.55 + vy * vy * 0.8, vig = 1 - 0.34 * Math.pow(v, 1.25);
      r *= vig; g *= vig * 0.988 + 0.012 * vig * vig; b *= vig * 0.965 + 0.0;
      // canvas weave + grain
      const gr = (hash2(x, y) - 0.5) * 0.022 + 0.005 * Math.sin(x * 2.2) * Math.sin(y * 2.2);
      d[k] = (r + gr) * 255; d[k + 1] = (g + gr) * 255; d[k + 2] = (b + gr * 0.9) * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  log('done');
  pbar.style.width = '100%'; ptxt.textContent = 'Finished';
  setTimeout(() => { prog.style.opacity = 0; }, 400);
  window.__renderDone = true;
  document.documentElement.dataset.ready = 'true';
  canvas.dataset.seed = String(SEED);
}

/* ---------- UI ---------- */
const lbl = document.getElementById('seedlbl'), again = document.getElementById('again');
function seedFromHash() {
  const q = new URLSearchParams(location.search).get('seed');
  if (q !== null && /^\d+$/.test(q)) return parseInt(q, 10);
  const m = /seed-(\d+)/.exec(location.hash || ''); return m ? parseInt(m[1], 10) : null;
}
async function go(seed) {
  again.disabled = true; lbl.textContent = 'Seed ' + seed; window.__renderDone = false; delete document.documentElement.dataset.ready;
  try { await render(seed); } catch (e) { console.error(e); ptxt.textContent = 'Render error: ' + e.message; }
  again.disabled = false;
}
again.addEventListener('click', () => {
  const s = (Math.floor(performance.now() * 7919) ^ (SEED * 2654435761)) >>> 0;
  const seed = 1000 + (s % 98000);
  try { history.replaceState(null, '', '#seed-' + seed); } catch (e) {}
  go(seed);
});
go(seedFromHash() ?? 1847);
})();
</script>
