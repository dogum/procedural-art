<script>
"use strict";

(() => {

const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});
function surface(w=W,h=H) {

function stringHash(s) {

  h^=h>>>16; h=Math.imul(h,0x85ebca6b); return (h^h>>>13)>>>0;

const seed=stringHash(requestedSeed);
// Independent streams keep weather, geology, and spray reproducible.
function stream(name) {

    state=(state+0x6d2b79f5)>>>0;
    let t=Math.imul(state^(state>>>15),state|1);

const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

function fb3(x,y) {return .56*noise(x,y)+.285*noise(1.73*x+.99*y+7.1,1.73*y-.99*x+5.7)+.155*noise(4.1*x-1.1*y,4.1*y+1.1*x+29.2);}

function line(c,x,y,xx,yy,color,w=1) {

for(let i=0;i<256;i++){const v=i/255;lin[i]=v<.04045?v/12.92:((v+.055)/1.055)**2.4;}

const project=(x,y,z)=>[HX+F*x/z,HY-F*(y-EYE)/z];
const PI=Math.PI;

for(let i=0;i<sinus.length;i++)sinus[i]=Math.sin(TAU*i/16384);

  c.beginPath();c.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)c.lineTo(points[i][0],points[i][1]);
  c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}

  x=clamp(x,0,sw-1.001);y=clamp(y,0,sh-1.001);
  const ix=x|0,iy=y|0,tx=x-ix,ty=y-iy,k=(iy*sw+ix)*4;
  for(let c=0;c<4;c++)out[c]=lerp(lerp(img[k+c],img[k+4+c],tx),lerp(img[k+sw*4+c],img[k+sw*4+4+c],tx),ty);

  const U=u*u*(3-2*u),V=v*v*(3-2*v),T=w*w*(3-2*w);
  const a=perm[ix&255]+(iy&255),b=perm[(ix+1)&255]+(iy&255);
  const aa=perm[a]+(iz&255),ab=perm[a+1]+(iz&255),ba=perm[b]+(iz&255),bb=perm[b+1]+(iz&255);
  return (lerp(lerp(lerp(perm[aa],perm[ba],U),lerp(perm[ab],perm[bb],U),V),

  const a=volumeNoise(x,y,z),b=volumeNoise(1.83*x+.75*z+17,2.04*y-.43*x+32,1.90*z-.65*x+11);
  const c=volumeNoise(3.95*x-.85*y+7,4.2*y+.88*z,4*z+.7*x+23);

function clearSky(){
  const im=ctx.createImageData(W,H),d=im.data;
  for(let y=0;y<H;y++){
    const v=clamp(y/HY),high=smooth(-.04,.82,v),low=smooth(.54,1,v);
    for(let x=0;x<W;x++){
      const dx=x-SUN.x,dy=y-SUN.y,dist=Math.hypot(dx,dy);
      const golden=Math.exp(-Math.abs(dx)/590),halo=Math.exp(-dist/190),aureole=Math.exp(-dist/46);
      let rr=lerp(lerp(53,154,high),186+63*golden,low);
      let gg=lerp(lerp(88,158,high),145+46*golden,low);
      let bb=lerp(lerp(125,177,high),146-14*golden,low);
      const scattered=clamp(.54*halo+.46*aureole+.10*golden*low);
      rr=lerp(rr,255,scattered);gg=lerp(gg,217,scattered);bb=lerp(bb,145,scattered);
      if(y<HY+2){
        const c=fb3(x*.003+4,y*.017+3.1*noise(x*.0018,y*.003)),ice=smooth(.16,.62,c)*(.27+.20*high);
        rr=lerp(rr,218+23*golden,ice);gg=lerp(gg,183+18*golden,ice);bb=lerp(bb,171+5*golden,ice);
        const disc=1-smooth(SUN.r-1,SUN.r+1,dist);
        rr=lerp(rr,255,disc);gg=lerp(gg,252,disc);bb=lerp(bb,229,disc);
      }else{
        const water=smooth(HY,H,y);rr=lerp(rr,30,water*.90);gg=lerp(gg,65,water*.85);bb=lerp(bb,77,water*.85);
      }
      const i=(y*W+x)*4,g=(hash2(x,y)-.5)*1.3;

        parcel(x,y,z,rad*(1.12+.42*age),rad*(.48+.35*r()),
          (.11+.22*r())*burst*(1-.63*age),light);
      }
      if(px>=1&&px<W-1&&py>=1&&py<H-1&&z<=visibleZ[(py|0)*W+(px|0)]+.14){
        const size=(.004+.018*r()**2)*fac*(.55+.82*r());
        droplets.push([px,py,size,VX*fac*.006,-(VY-9.81*age)*fac*.007,light,.22+.63*r(),age]);
      }
    }
    if(mode==='reef'&&r()<.69){
      const p=project(X,Y,Z),v=2.45+2.05*r();
      jets.push([p[0],p[1],v*F/Z*.29,phase,.32+.63*r(),Z]);
    }
  }
  for(let j=0;j<229;j++){
    const x=-26+r()*34,k=pathIndex(x),amp=breaker[k+1],cr=breaker[k+3];
    const breakHere=clamp(.19+.62*cr+.27*noise(x*.64+4,12.85)+.18*noise(x*.25,69));
    if(amp<1.0||r()>breakHere+.12)continue;
    const t=lerp(.194,.47,cr)+.052*gauss(r),q=breaker[k]+breaker[k+2]*t;
    seaPoint(x,q,null,sample);const Z=sample.z,X=x*Z/q;
    addEmitter(X,sample.y-.041,Z,clamp(.66+.40*cr+.31*noise(x*.55,16.1),.40,1.54),'breaker',52+Math.round(40*r()));
  }
  // Shoaling varies along the reef. At the western end the lip has already
  // struck the face. A cluster of plumes is thrown out in front of the wave.
  for(let j=0;j<83;j++){
    const x=-16.0+gauss(r)*2.27,k=pathIndex(x),u=-.52+.23*r();
    const q=breaker[k]+breaker[k+2]*u;seaPoint(x,q,null,sample);
    const Z=sample.z-.26-.55*r(),X=x*sample.z/q,Y=sample.y+.12;
    const burst=clamp(.55+.64*noise(x*1.17,32.3)+.42*r(),.31,1.37);
    const n=26+Math.floor(burst*38);
    for(let m=0;m<n;m++){
      const t=r()*.53,vx=-1.4-2.8*r(),vy=2.1+3.2*r(),vz=-1.9-2.0*r();
      const xx=X+vx*t*burst+.13*gauss(r),yy=Y+vy*t*burst-4.905*t*t,zz=Z+vz*t;
      const pp=project(xx,yy,zz),size=F/zz*(.065+.19*r()+.31*t);
      if(m%3===0)parcel(xx,yy,zz,size*1.37,size*.89,.18+.37*r(),.44+.39*t+.14*r());
      const px=pp[0]|0,py=pp[1]|0;
      if(px>=0&&px<W&&py>=0&&py<H&&zz<visibleZ[py*W+px]+.12)
        droplets.push([pp[0],pp[1],(.007+.017*r())*F/zz,vx*.19,-(vy-9.81*t)*.16,.60+.35*r(),.44+.49*r(),t]);
    }
  }
  // Use the actual projected summit for the wind combed from the crest.
  for(let j=0;j<85;j++){
    const x=(j%4===0?-5.6:-12.8)+gauss(r)*(j%4===0?1.26:2.2),k=pathIndex(x);
    let y=0,z=1,X=0,highest=H;
    for(let n=0;n<18;n++){
      const q=breaker[k]+breaker[k+2]*(.11+n*.027);
      seaPoint(x,q,null,sample);
      const screen=HY+F*(EYE-sample.y)/sample.z;
      if(screen<highest){highest=screen;y=sample.y;z=sample.z;X=x*z/q;}
    }
    const burst=.49+.65*Math.max(0,noise(x*.78,39))+.23*r();
    for(let m=0;m<37;m++){
      const t=r()*.81,vx=-(1.5+3.8*r())*burst,vy=(2.35+3.94*r())*burst,vz=.43-r()*.97;
      const xx=X+vx*t-.6*t*t+.10*gauss(r),yy=y+vy*t-4.905*t*t,zz=z+vz*t;
      if(yy<y-.18)continue;
      if(m%3===0){
        const size=(.065+.235*r()+.44*t)*F/zz;
        parcel(xx,yy,zz,size*(1.15+.81*t),size*.71,.13+.31*r(),.78+.20*r());
      }
      const pp=project(xx,yy,zz),px=pp[0]|0,py=pp[1]|0;
      if(px>=0&&px<W&&py>=0&&py<H&&zz<visibleZ[py*W+px]+.14)
        droplets.push([pp[0],pp[1],(.0037+.017*r()**1.5)*F/zz,vx*.23,-(vy-9.81*t)*.22,.78+.20*r(),.37+.58*r(),t]);
    }
  }
  // Local impacts around the arch and in the nearer channels.
  const splashes=[[3.3,85.3,1.26],[7.1,82.2,.82],[28.9,81.4,1.48],[34.5,77.2,.87],
    [15.0,48.2,.90],[11.1,17.3,.45],[9.63,15.4,.37]];
  for(const [x,z,e] of splashes)for(let j=0;j<16;j++){
    const xx=x+gauss(r)*e*.62,zz=z+gauss(r)*e*.35;
    seaPoint(xx,zz,null,sample);
    const y=Math.max(.11,sample.y);
    addEmitter(xx,y+.12,zz,e*(.65+.61*r()),'reef',37);
  }
  const im=ctx.getImageData(0,0,W,H),d=im.data;
  for(let y=410;y<H;y++)for(let x=0;x<W;x++){
    const ix=x>>1,iy=y>>1,k=iy*mw+ix;
    if(volume[k]<.002&&(ix===mw-1||volume[k+1]<.002)&&(iy===mh-1||volume[k+mw]<.002))continue;
    const fx=x*.5-ix,fy=y*.5-iy,ka=iy*mw+Math.min(ix+1,mw-1),kb=Math.min(iy+1,mh-1)*mw+ix,kc=Math.min(iy+1,mh-1)*mw+Math.min(ix+1,mw-1);
    const rho=lerp(lerp(volume[k],volume[ka],fx),lerp(volume[kb],volume[kc],fx),fy);
    const l=clamp(lerp(lerp(tone[k],tone[ka],fx),lerp(tone[kb],tone[kc],fx),fy)/(.0001+rho));
    const eddy=fb3(x*.046-y*.019,y*.076)+.21*noise(x*.21,y*.23);
    const op=1-Math.exp(-rho*(.54+.38*eddy)),k4=(y*W+x)*4,back=Math.exp(-Math.abs(x-SUN.x)/473);
    const r0=lerp(169,248,l)+7*back,g0=lerp(184,236,l),b0=lerp(184,217,l)-5*back;
    d[k4]=lerp(d[k4],r0+eddy*11,op);d[k4+1]=lerp(d[k4+1],g0+eddy*9,op);d[k4+2]=lerp(d[k4+2],b0+eddy*6,op);
  }
  ctx.putImageData(im,0,0);
  for(const [x,y,h,a,shade,z] of jets){
    for(let j=0;j<4;j++){
      const xx=x+(r()-.5)*h*.32,dx=(r()-.39)*h*.68,len=h*(.30+.85*r());
      if(z>visibleZ[clamp(y|0,0,H-1)*W+clamp(xx|0,0,W-1)]+.5)continue;
      ctx.strokeStyle=rgb(mix([155,183,186],[237,229,203],shade),.22+.25*r());ctx.lineWidth=.48+.43*r();
      ctx.beginPath();ctx.moveTo(xx,y);ctx.quadraticCurveTo(xx+dx*.25,y-len*.88,xx+dx,y-len);ctx.stroke();
    }
  }
  for(const [x,y,sz,dx,dy,light,a,age] of droplets){
    if(sz<.31&&a<.49)continue;
    const col=mix([159,188,189],[253,239,208],light);
    if(sz>.57&&age>.16)line(ctx,x,y,x+dx,y+dy,rgb(col,a*.73),Math.max(.45,sz*.86));
    else ellipse(ctx,x,y,Math.max(.23,sz),Math.max(.20,sz*.77),0,rgb(col,a*.82));
  }
}
function fulmars(){
  const r=stream('fulmars on the wind');
  const flock=[[934,284,27,-.19],[908,300,14,.23],[998,316,17,.40],[1096,336,12,-.28],
    [1113,333,8,-.35],[1187,399,10,.16],[1397,405,12,-.54],[1422,413,7,.14],
    [714,260,9,.18],[681,267,6,-.21],[1650,236,12,.12],[1629,240,8,-.25]];
  for(const [x,y,s,roll] of flock){
    const fore=.64+.44*r(),far=.64+.31*r(),flex=r()*.17;
    ctx.save();ctx.translate(x,y);ctx.rotate(roll);ctx.scale(s,s);
    ctx.fillStyle=rgb(mix([62,72,81],[116,120,119],r()*.65));ctx.beginPath();
    ctx.moveTo(-fore*.56,-.19-flex);ctx.bezierCurveTo(-.34,-.18,-.18,-.045,-.055,-.019);
    ctx.quadraticCurveTo(.042,-.06,.087,-.047);ctx.quadraticCurveTo(.23,-.224,far*.54,-.204-flex);
    ctx.quadraticCurveTo(.27,-.166,.11,.026);ctx.lineTo(.027,.062);ctx.lineTo(-.079,.087);
    ctx.lineTo(-.066,.028);ctx.bezierCurveTo(-.25,-.003,-.39,-.174,-fore*.56,-.19-flex);ctx.fill();
    if(s>10){
      ctx.fillStyle='rgba(231,216,181,.88)';ctx.beginPath();ctx.moveTo(-fore*.38,-.14-flex*.72);
      ctx.quadraticCurveTo(-.15,-.093,-.02,.007);ctx.quadraticCurveTo(-.18,-.04,-fore*.38,-.14-flex*.72);ctx.fill();
    }
    ctx.restore();
  }
}
function finish(){
  const im=ctx.getImageData(0,0,W,H),d=im.data,src=new Uint8ClampedArray(d);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const j=y*W+x,k=j*4;
    let rr=src[k],gg=src[k+1],bb=src[k+2];
    // Subpixel smoothing restricted to high-contrast geometric silhouettes.
    if(x>0&&x<W-1&&y>0&&y<H-1){
      const mask=visibleZ[j]<185,l=visibleZ[j-1]<185,r=visibleZ[j+1]<185,
        u=visibleZ[j-W]<185,v=visibleZ[j+W]<185;
      if((l!==r||u!==v)&&Math.abs(src[k+1]-src[k+5])+Math.abs(src[k+1]-src[k+4*W+1])>47){
        const nb=mask?(l!==mask?k-4:r!==mask?k+4:u!==mask?k-4*W:k+4*W):
                    (l?k-4:r?k+4:u?k-4*W:k+4*W);
        rr=lerp(rr,src[nb],.14);gg=lerp(gg,src[nb+1],.14);bb=lerp(bb,src[nb+2],.14);
      }
    }
    const l=.225*rr+.685*gg+.09*bb,lum=l/255,shade=sq(1-lum),contrast=8.7*Math.tanh((lum-.52)*3.0);
    const ax=(x-W*.49)/(W*.72),ay=(y-H*.48)/(H*.99),vignette=1-.12*clamp((ax*ax+ay*ay-.17)*1.14);
    const grain=(hash2(x+19,y+71)-.5)*2.45;
    d[k]=(l+(rr-l)*1.065+contrast+2.2*lum-1.6*shade)*vignette+grain;
    d[k+1]=(l+(gg-l)*1.052+contrast*.86+.68*lum)*vignette+grain;
    d[k+2]=(l+(bb-l)*1.064+contrast*.70-1.46*lum+2.1*shade)*vignette+grain;
  }
  ctx.putImageData(im,0,0);
}
async function paint(){
  await step('Gathering the storm light…');clearSky();stormDeck();
  await step('Weathering the sea arch…');headlands();rockCoast();intertidal();
  await step('Lighting the keeper’s lantern…');keeperStation();
  await step('Raising the Atlantic swell…');buildWater();shadeWater();
  await step('Carrying the spray downwind…');airInTheBreaker();oceanSpray();fulmars();finish();
  canvas.dataset.seed=requestedSeed;document.body.dataset.ready='true';status.hidden=true;
}
paint().catch(error=>{status.textContent='The painting could not finish. Reload to try again.';console.error(error);});
})();
