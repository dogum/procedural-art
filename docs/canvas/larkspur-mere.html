<body><main aria-label="First Light at Larkspur Mere">
<canvas id="painting" width="1920" height="1080" role="img" aria-label="An ancient lakeside forest frames a still alpine lake, rugged snow-covered peaks, and low golden sunlight.">This landscape requires a browser with HTML5 Canvas.</canvas>
<div id="progress" role="status">Drawing the morning sky…</div>
</main>
<script>
"use strict";
/*
  FIRST LIGHT AT LARKSPUR MERE
  A deterministic landscape for Canvas 2D. Open the file directly. A seed can
  be supplied with ?seed=... or #seed=... . All distances in the alpine
  height field are in metres. Botanical geometry is in projected pixels.
*/
(() => {
const W = 1920, H = 1080, HX = 960, HY = 611, FOCAL = 1260;
const SUN = {x: 1383, y: 360};
const TAU = Math.PI * 2;
const requestedSeed = new URLSearchParams(location.search).get('seed') ??
                      new URLSearchParams(location.hash.slice(1)).get('seed') ?? 'larkspur-17';
const canvas = document.getElementById('painting');
const ctx = canvas.getContext('2d', {alpha: false, willReadFrequently: true});
const status = document.getElementById('progress');
function surface(w=W,h=H) {
  const el=document.createElement('canvas'); el.width=w; el.height=h;
  return el.getContext('2d',{willReadFrequently:true});
}
function stringHash(s) {
  let h=2166136261;
  for(let i=0;i<s.length;i++) h=Math.imul(h^s.charCodeAt(i),16777619);
  h^=h>>>16; h=Math.imul(h,0x85ebca6b); return (h^h>>>13)>>>0;
}
const seed=stringHash(requestedSeed);
// Independent named streams keep a change to the grass from moving a summit.
function stream(name) {
  let state=(seed^stringHash(name))>>>0;
  return function() {
    state=(state+0x6d2b79f5)>>>0;
    let t=Math.imul(state^(state>>>15),state|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const clamp=(x,lo=0,hi=1)=>x<lo?lo:x>hi?hi:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const sq=x=>x*x;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a=1)=>'rgba('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+','+a+')';
const gauss=(r)=>Math.sqrt(-2*Math.log(.000001+.999999*r()))*Math.cos(TAU*r());

    if(x<=arr[i][0]) {
      const a=arr[i-1],b=arr[i],p=arr[Math.max(0,i-2)],q=arr[Math.min(arr.length-1,i+1)];
      const t=(x-a[0])/(b[0]-a[0]),t2=t*t,t3=t2*t;
      const m0=(b[1]-p[1])/(b[0]-p[0])*(b[0]-a[0]),m1=(q[1]-a[1])/(q[0]-a[0])*(b[0]-a[0]);
      return (2*t3-3*t2+1)*a[1]+(t3-2*t2+t)*m0+(-2*t3+3*t2)*b[1]+(t3-t2)*m1;
    }

}
const perm=new Uint16Array(512), order=Array.from({length:256},(_,i)=>i), nr=stream('permutation');
for(let i=255;i>0;i--){let j=Math.floor(nr()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
for(let i=0;i<512;i++)perm[i]=order[i&255];
const gx=new Float64Array(256),gy=new Float64Array(256);
for(let i=0;i<256;i++){let a=i*2.399963229728653;gx[i]=Math.cos(a);gy[i]=Math.sin(a);}
function noise(x,y) {
  const ix=Math.floor(x),iy=Math.floor(y),u=x-ix,v=y-iy;
  const a=perm[ix&255]+(iy&255), b=perm[(ix+1)&255]+(iy&255);
  const aa=perm[a],ab=perm[a+1],ba=perm[b],bb=perm[b+1];

  const p=gx[aa]*u+gy[aa]*v, q=gx[ba]*(u-1)+gy[ba]*v;

}
function fb(x,y) {

  return s;
}
function fb3(x,y) {return .56*noise(x,y)+.285*noise(1.73*x+.99*y+7.1,1.73*y-.99*x+5.7)+.155*noise(4.1*x-1.1*y,4.1*y+1.1*x+29.2);}
function hash2(x,y) {
  let n=Math.imul(x^seed,0x1f1f1f1f)^Math.imul(y,0x5bd1e995);
  n=Math.imul(n^(n>>>15),0x2c1b3c6d);return ((n^(n>>>12))>>>0)/4294967296;
}
function ellipse(c,x,y,rx,ry,angle,color) {

  c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,angle,0,TAU);c.fill();
}
function line(c,x,y,xx,yy,color,w=1) {
  c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke();
}
function glow(c,x,y,rx,ry,color,alpha) {
  if(rx<=0||ry<=0||alpha<=0)return;
  c.save();c.translate(x,y);c.scale(rx,ry);let g=c.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,rgb(color,alpha));g.addColorStop(.28,rgb(color,alpha*.62));
  g.addColorStop(.66,rgb(color,alpha*.17));g.addColorStop(1,rgb(color,0));

async function step(message) {
  status.textContent=message;
  await new Promise(resolve=>setTimeout(resolve,12));
}
function sky() {
  const img=ctx.createImageData(W,HY+2),d=img.data;
  for(let y=0;y<=HY+1;y++) {
    const v=y/HY,upper=smooth(-.13,.78,v),low=smooth(.40,1,v);
    const r0=lerp(lerp(72,177,upper),245,low),g0=lerp(lerp(121,191,upper),214,low),b0=lerp(lerp(155,195,upper),168,low);
    for(let x=0;x<W;x++) {
      const k=(y*W+x)*4,dx=x-SUN.x,dy=y-SUN.y,dist=Math.sqrt(dx*dx+dy*dy);
      const forward=Math.exp(-dist/390),warm=clamp(.67*forward+.13*(x/W)),rim=Math.exp(-dist/74);
      let r=lerp(r0,255,warm),g=lerp(g0,213,warm),b=lerp(b0,149,warm);
      // Flatten the sampling plane towards the horizon, as for a high cloud deck.
      let warp=noise(x*.00175+8,y*.0034+32);
      const p=fb(x*.0022+warp*.66+7.2,y*.0078+warp*1.3+2.1);
      const fil=fb3(x*.0054+2*p,y*.028+1.7*warp);
      const band=.075*Math.cos(y*.034+x*.0026)+.1*Math.sin(x*.003-y*.016);
      let coverage=smooth(.035,.50,p+.17*fil+band)*(.73-.21*low);
      const shade=clamp(.45+p*.74+fil*.21);
      r=lerp(r,lerp(158,242,shade)+16*forward,coverage);
      g=lerp(g,lerp(150,214,shade)+8*forward,coverage);
      b=lerp(b,lerp(159,179,shade)+2*forward,coverage);
      const silk=smooth(.29,.67,fb3(x*.0037+.7*p+75,y*.031+2*p))*.19*(1-low);
      r+=silk*75;g+=silk*48;b+=silk*26;
      const halo=clamp(.31*forward+.73*rim),core=1-smooth(11.5,13.8,dist);
      r=lerp(lerp(r,255,halo),255,core);g=lerp(lerp(g,237,halo),251,core);
      b=lerp(lerp(b,178,halo),223,core);
      const grain=(hash2(x,y)-.5)*1.5;
      d[k]=r+grain;d[k+1]=g+grain;d[k+2]=b+grain;d[k+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}
// Integrated optical thickness of wind-sheared cloud cells. The incoming-light
// pass samples towards the sun to give the billows a silver-gold lower edge.
function morningClouds(){
  const top=0,hi=260,w=W,n=w*hi,r=stream('sunlit vapour');
  const mass=new Float32Array(n),base=ctx.getImageData(0,top,w,hi),d=base.data;
  const groups=[
    [926,43,206,28,.82,-.08],[1101,48,139,21,.67,.10],[1194,60,112,20,.71,-.05],
    [1033,181,113,20,.76,-.16],[1152,162,68,14,.62,-.21],
    [1435,104,134,17,.55,-.025],[650,60,155,26,.61,.04]
  ];
  for(const [cx,cy,span,rise,strength,shear] of groups){
    for(let j=0;j<29;j++){
      const u=r()*2-1,v=gauss(r)*.47;
      const x=cx+span*u,y=cy+u*span*shear+v*rise*Math.sqrt(Math.max(0,1-u*u));
      const sx=span*(.085+.21*r())*(.7+.5*(1-u*u)),sy=rise*(.25+.55*r());
      const height=strength*(.47+.61*r())*(.58+.4*(1-u*u));
      const xa=Math.max(0,Math.floor(x-sx)),xb=Math.min(w-1,Math.ceil(x+sx));
      for(let yy=Math.max(0,Math.floor(y-sy));yy<=Math.min(hi-1,Math.ceil(y+sy));yy++){
        const v2=sq((yy-y)/sy);
        for(let xx=xa;xx<=xb;xx++){
          const chord=1-sq((xx-x)/sx)-v2;if(chord<=0)continue;
          const k=yy*w+xx,amount=height*Math.sqrt(chord);
          mass[k]=Math.max(mass[k],amount)+Math.min(amount,mass[k])*.016;
        }
      }
    }
  }
  const density=new Float32Array(n);
  for(let y=0;y<hi;y++)for(let x=0;x<w;x++){
    const t=fb3(x*.017+2.2,y*.041+37);
    const xx=clamp(Math.round(x+8*t+6*noise(x*.008,y*.017)),0,w-1);
    const yy=clamp(Math.round(y+8*fb3(x*.012+36,y*.026)+3*t),0,hi-1);
    const m=mass[yy*w+xx];
    if(m>0)density[y*w+x]=Math.max(0,m-.22+.29*t+.11*noise(x*.058,y*.094));
  }
  for(let y=0;y<hi-1;y++)for(let x=0;x<w-1;x++){
    const k=y*w+x,a=density[k];if(a<=0)continue;
    const sunward=density[Math.min(hi-1,y+7)*w+Math.min(w-1,x+9)]*.62+
                  density[Math.min(hi-1,y+18)*w+Math.min(w-1,x+27)]*.38;
    const lighting=clamp(.70+.81*(a-sunward)-.48*sunward+.12*noise(x*.039,y*.064));

    d[i+1]=lerp(d[i+1],lerp(139,228,lighting),op);
    d[i+2]=lerp(d[i+2],lerp(150,193,lighting),op);
  }

}
function swifts(){
  const r=stream('swifts in the pass');
  for(const [x,y,span,roll] of [[1066,210,6.8,-.21],[1087,204,5.5,.17],[1114,214,8.1,-.19],
    [1149,211,4.1,-.29],[1161,207,3.1,.10]]){
    ctx.save();ctx.translate(x,y);ctx.rotate(roll);
    const col=mix([66,81,84],[134,143,137],r()*.59);
    ctx.fillStyle=rgb(col,.72);ctx.beginPath();ctx.moveTo(-span*.5,-span*.16);
    ctx.quadraticCurveTo(-span*.20,-span*.17,0,.1);ctx.quadraticCurveTo(span*.21,-span*.27,span*.51,-span*.24);
    ctx.quadraticCurveTo(span*.22,-span*.09,span*.06,.5);ctx.lineTo(-span*.09,.98);
    ctx.quadraticCurveTo(-span*.23,-.18,-span*.5,-span*.16);ctx.fill();ctx.restore();
  }
}
// The alpine massif is a sampled, eroded height field. Its visible point and
// its shadow are computed in world space; no mountain silhouettes are stamped.
function alpineMassif() {

    [-158,264,7200,1.17,-.4],[45,317,6850,1.04,.65],[200,293,7800,1.3,.4],
    [361,358,7130,1.17,-.35],[454,344,6450,1.22,-.6],[512,311,7160,.96,.34],
    [625,301,6200,1.45,-.28],[688,247,6400,1.48,.1],[754,235,6230,1.6,-.35],
    [824,153,6030,1.58,-.4],[863,192,6090,1.51,-.20],[922,250,6180,1.40,.64],
    [974,266,6380,1.43,-.5],[1036,311,6800,1.2,-.42],[1097,303,6740,1.37,.32],
    [1173,371,7120,1.22,-.28],[1245,385,7950,1.13,.68],[1363,439,8420,1.1,-.61],
    [1474,425,7900,1.03,.62],[1544,348,7710,1.21,.13],[1670,280,7500,1.36,-.52],
    [1775,286,7150,1.30,.29],[1895,235,7080,1.22,.47],[2100,294,7150,1.19,-.64]
  ].map(([sx,sy,z,slope,rot])=>({x:(sx-HX)*z/FOCAL,z,h:(HY-sy)*z/FOCAL,
    slope,c:Math.cos(rot),s:Math.sin(rot)}));

  }

}
// Conifers are whorls of radial boughs. Nearer specimens generate pendulous
// secondary sprays and individual needle strokes. Distant ones use fewer whorls.
const treePal={
  mist:[[113,139,146],[142,155,146],[179,178,143]],
  far:[[79,111,117],[104,132,124],[153,158,124]],
  middle:[[42,74,76],[68,96,82],[125,137,95]],
  deep:[[23,51,51],[48,78,61],[111,122,77]],
  near:[[17,37,39],[41,68,52],[98,112,67]],
  pine:[[17,34,35],[41,56,43],[103,107,63]]
};

  lo=Math.max(0,Math.floor(lo));hi=Math.min(W,Math.ceil(hi));

    [388,1043,61,2],[1716,1044,74,2],[1734,1049,97,2],[1815,986,69,1],[1825,1001,54,1]])plants.push(p);

function fernBeds(){
  const r=stream('sword ferns');
  const groups=[[34,820,38],[73,871,42],[133,912,52],[229,928,39],[305,871,30],[36,958,61],
    [130,1033,73],[227,1079,84],[28,1088,99],[448,1036,41],[541,1065,48],[1822,899,34],
    [1900,958,63],[1808,987,46],[1674,1047,61],[1888,1086,98],[1591,1067,35]];

    const c=plantLayer(x,y);

}
function reeds() {
  const r=stream('water reeds');
  const patches=[[514,991,22],[614,1031,45],[700,1061,39],[456,914,20],[1616,1028,29],[1526,1069,47],[1768,916,17]];
  for(const [x,y,s] of patches){
    for(let i=0;i<14;i++){
      const xx=x+gauss(r)*s*.42,yy=y+gauss(r)*s*.12,h=s*(.49+1.00*r()),lean=(r()-.45)*h*.91;
      if(islandOfStone(xx,yy))continue;

      if(r()<.22)ellipse(c,xx+lean*.96,yy-h*.96,Math.max(.51,h*.024),h*.07,Math.atan(lean/h),rgb([113,103,61]));

}
const toLinear=new Float32Array(256),toSRGB=new Uint8ClampedArray(8193);
for(let i=0;i<256;i++){const t=i/255;toLinear[i]=t<=.04045?t/12.92:((t+.055)/1.055)**2.4;}
for(let i=0;i<8193;i++){const t=i/8192;toSRGB[i]=255*(t<=.0031308?t*12.92:1.055*Math.pow(t,1/2.4)-.055);}
// Projected Voronoi gravel. The nearest two jittered centres give the boulder
// interior and a narrow sand-filled contact, independently for each lake-bed cell.
function shingle(wx,wz,disturbance) {
  const X=wx*6.1+.46*disturbance,Y=wz*6.1+.58*noise(wx*.96,wz*1.22);
  const ix=Math.floor(X),iy=Math.floor(Y);let closest=9,next=9,bx=0,by=0,id=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    const cx=ix+i,cy=iy+j;
    const u=X-cx-(.15+.7*hash2(cx+7,cy)),v=Y-cy-(.15+.7*hash2(cx,cy+61));
    const d=u*u+v*v;
    if(d<closest){next=closest;closest=d;bx=u;by=v;id=hash2(cx+404,cy-79);}
    else if(d<next)next=d;
  }
  const narrow=1-smooth(.018,.28,next-closest),form=clamp(.68-.84*bx+.68*by-.83*closest);
  const col=.21+.34*id+.31*form-.27*narrow+.09*disturbance;
  return clamp(col);
}
function finishLake() {
  const start=HY+1,height=H-start,refl=mirror.getImageData(0,HY-4,W,H-HY+4),src=refl.data;
  const out=ctx.createImageData(W,height),dst=out.data,eye=3.25,refHeight=refl.height;
  const rings=[[497,824,66,.62],[1812,911,52,.49],[613,1023,93,.58],[1516,1025,81,.60],[814,846,71,.27],
               [1137,956,44,.31],[735,688,59,.33]];
  for(let y=start;y<H;y++){
    const offset=y-HY+.15,v=offset/(H-HY),wz=eye*FOCAL/offset,foot=wz/offset;
    const alias1=Math.exp(-sq(foot*2.15)),alias2=Math.exp(-sq(foot*5.5)),alias3=Math.exp(-sq(foot*13));
    for(let x=0;x<W;x++){
      const wx=(x-HX)*wz/FOCAL,edge=Math.max(0,-bankDistance(x,y));
      const cat=fb3(wx*.62+8.3,wz*.70+3.4);
      const breeze=.36+.76*smooth(-.35,.46,cat+.23*noise(wx*2,wz*2));
      const drift=.48*noise(wx*.80,wz*.74),w1=alias1*Math.sin(wx*1.8+wz*6.4+drift*2.2),
            w2=alias2*Math.sin(-wx*2.9+wz*13.6+1.9*drift),
            w3=alias3*Math.sin(wx*5.0+wz*33.8+2*cat+.8*w1);
      let ring=0;
      for(const [cx,cy,radius,strength] of rings){
        const dy=y-cy,dx=x-cx;
        if(Math.abs(dy)>radius*.22||Math.abs(dx)>radius)continue;
        const rr=Math.hypot(dx,dy/.19);
        if(rr<radius)ring+=strength*Math.sin(rr*.58)*smooth(0,9,rr)*sq(1-rr/radius);
      }
      const ripple=(w1*.65+w2*.35+w3*.28)*breeze+ring;
      const amp=.40+4.0*Math.pow(v,.74);
      const rx=clamp(x+amp*(.26*w1-.18*w2+.11*w3)*breeze,0,W-1.002);
      const ry=clamp(y-HY+4+amp*ripple,0,refHeight-1.002),ix=rx|0,iy=ry|0;
      const tx=rx-ix,ty=ry-iy,j=(iy*W+ix)*4;
      const angle=clamp((offset/Math.hypot(FOCAL,x-HX,offset))+.0025*ripple);
      const fresnel=.02037+.97963*Math.pow(1-angle,5);
      // Snell's law bends the transmitted ray towards the lake-bed normal.
      const horizontal=Math.sqrt(Math.max(0,1-angle*angle))/1.333;
      const tanRefracted=horizontal/Math.sqrt(1-horizontal*horizontal);
      const realGap=edge*wz/FOCAL;
      const depth=Math.max(.14,.19+.53*realGap+.012*Math.max(0,wz-9)+.11*cat);
      const Tred=Math.exp(-.78*depth/Math.sqrt(1-horizontal*horizontal));
      const Tgreen=Math.exp(-.36*depth/Math.sqrt(1-horizontal*horizontal));
      const Tblue=Math.exp(-.27*depth/Math.sqrt(1-horizontal*horizontal));
      let rock=.42,caustic=0;
      if((1-fresnel)*Tgreen>.026){
        const bedZ=wz+depth*tanRefracted;
        const bedX=wx+(x-HX)/FOCAL*depth*tanRefracted+amp*ripple*.007;
        const glacial=fb3(bedX*1.19+15,bedZ*1.48),bedNoise=fb3(bedX*3.4,bedZ*2.8);
        const small=shingle(bedX*3.0+4.1,bedZ*3.0,bedNoise),large=shingle(bedX*1.14,bedZ*1.14,bedNoise);

        const rays=noise(bedX*6.2+.71*cat,bedZ*6.5+cat);

      const scatterR=.006,scatterG=.060,scatterB=.074;

      const nearShade=.81+.19*smooth(2,80,edge);

      const disc=1-smooth(9.0,15.0,rad);
      const glitter=Math.exp(-sq(solarX/(15+.23*Math.abs(solarY)))-sq(solarY/46))*
         smooth(.16,.87,ripple+.17*noise(x*.041,y*.46));

        const rr=lerp(lerp(src[j+b],src[j+4+b],tx),lerp(src[j+W*4+b],src[j+W*4+4+b],tx),ty);
        const light=toLinear[clamp(Math.round(rr),0,255)];

    }
  }
  ctx.drawImage(background.canvas,0,0);ctx.putImageData(out,0,start);ctx.drawImage(world.canvas,0,0);
}
function pollen() {
  // A deterministic snapshot of particles advected through a two-frequency
  // curl-like wind field. Motes are brightest when directly in the sun shafts.
  const r=stream('pollen advection'),particles=[];
  for(let i=0;i<590;i++){
    const left=r()<.57,x=left?-45+r()*765:1334+r()*656;
    particles.push({x,y:175+r()*716,vx:(r()-.1)*.26,vy:r()*.16,z:.12+.87*r(),life:r(),phase:r()*TAU});
  }
  for(let frame=0;frame<39;frame++)for(const p of particles){
    const t=frame/24;
    p.vx=.96*p.vx+.014*noise(p.x*.008,p.y*.009+t*.07)+.0035;
    p.vy=.96*p.vy-.006*noise(p.x*.011+43,p.y*.012+t*.093)+.002*Math.cos(p.phase+t);
    p.x+=p.vx*(.4+p.z);p.y+=p.vy*(.4+p.z);

  for(const p of particles){
    const a=Math.atan2(p.y-SUN.y,p.x-SUN.x),shaft=.19+.81*Math.exp(-sq((a-2.80)/.24));
    const illumination=clamp(.19+.48*shaft+.33*noise(p.x*.012,p.y*.015)+.17*p.life);
    if(illumination<.36||p.y>HY+140&&bankDistance(p.x,p.y)<-15)continue;
    const s=(.32+1.27*p.z*p.z)*(.68+.54*p.life);
    if(s>1.14)glow(ctx,p.x,p.y,s*3.1,s*2.8,[255,219,143],illumination*.19);
    ellipse(ctx,p.x,p.y,s,s*.63,p.phase,rgb([255,235,177],illumination*.78));
  }
}
function opticalFinish(){
  const im=ctx.getImageData(0,0,W,H),d=im.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=(y*W+x)*4,ax=(x-W*.55)/(W*.70),ay=(y-H*.45)/(H*.94);
    const vignette=1-.13*clamp((ax*ax+ay*ay-.22)*1.18);
    const grain=(hash2(x+771,y-83)-.5)*2.2;
    const lum=(.22*d[k]+.69*d[k+1]+.09*d[k+2])/255;
    // Mild toe, a restrained warm shoulder and blue-green skylight in the shadows.
    const shade=sq(1-lum),contrast=7.8*Math.tanh((lum-.54)*3.3),neutral=lum*255;
    const chroma=1.043;

    d[k+1]=(neutral+(d[k+1]-neutral)*chroma+contrast*.86+.75*lum)*vignette+grain;
    d[k+2]=(neutral+(d[k+2]-neutral)*chroma+contrast*.69-2.5*lum+2*shade)*vignette+grain;

// March towards the solar vanishing point through an opacity field constructed
// from the actual rendered boughs. Lit openings and their penumbrae pass across
// the low mist at the forest margins. A second, local sample lights needle rims.
function canopyScattering() {
  const mw=W/4,mh=H/4,mask=woodOcclusion.getImageData(0,0,mw,mh).data;
  const view=ctx.getImageData(0,0,W,H),d=view.data;
  function density(x,y) {
    const xx=clamp(x*.25,0,mw-1.001),yy=clamp(y*.25,0,mh-1.001);
    const i=xx|0,j=yy|0,tx=xx-i,ty=yy-j,k=(j*mw+i)*4+3;
    return lerp(lerp(mask[k],mask[k+4],tx),lerp(mask[k+mw*4],mask[k+mw*4+4],tx),ty)/255;
  }
  for(let y=150;y<910;y++)for(let x=0;x<W;x++) {
    if(x>530&&x<1450)continue;
    const east=x>HX,cx=east?1717:192,cy=east?594:493;
    const volume=Math.exp(-sq((x-cx)/(east?229:268))-sq((y-cy)/(east?158:154)))*
      smooth(155,293,y)*smooth(900,779,y);
    if(volume<.016)continue;
    const dx=SUN.x-x,dy=SUN.y-y,dist=Math.hypot(dx,dy),sx=dx/dist,sy=dy/dist;
    let trans=1,radiance=0;

      const occ=density(x+sx*ray,y+sy*ray);

// Progress frames show the work already completed. The final optical pass always

function underpaintLake(){

function previewPainting(){

  veil.addColorStop(1,'rgba(22,65,66,.45)');ctx.fillStyle=veil;ctx.fillRect(0,HY+1,W,H-HY-1);

async function paint() {

  await step('Tracing light through the trees…');tallerWood();sunbeams();island();previewPainting();
  await step('Weathering the lakeshore…');paintBanks();rocks();previewPainting();
