    for(let j=0;j<13;j++){const dx=(r2()-.48)*sz*2.4,dy=r2()*sz*1.12;line(g,xx,yy+.1,xx+dx,yy-dy,rgb(58+r2()*23,66+r2()*20,49+r2()*15,.83),.70)}
    if(r2()<.19)pine(g,G,p,1.2+r2()*2.45,1000+i,1);
  }
  for(const s of pts){
    const p=s.p,[px,py]=project(...p);
    if(px<-14||px>W+14)continue;
    const density=clamp(.46+.42*noise(p[0]*.088,p[2]*.087));
    if(r()<density*.72&&p[0]<-44){
      const ht=1.7+Math.pow(r(),2)*7.3;
      pine(g,G,[p[0]-s.n[0]*1.4,p[1]+.16,p[2]-s.n[1]*1.4],ht,Math.round(p[0]*92+p[2]),1);
    }
    if(occluded(G,px,py-.6,p[2],6))continue;
    for(let j=0;j<8;j++){const xx=px+(r()-.5)*6,hh=.6+r()*2.9;line(g,xx,py+1,xx+r()*2.3,py+1-hh,rgb(89+r()*34,92+r()*21,66+r()*16,.76),.58)}
  }
}
function travellers(G){
  const z=211.2,x=trail(z)+.12,y=ground(x,z),p=project(x,y,z),s=F/z;
  if(occluded(G,p[0],p[1]-s,z,2))return;
  const g=ctx,xx=p[0],yy=p[1]-.13*s;
  // A walker on the old route and a single lateen boat establish human scale.
  line(g,xx-.08*s,yy-.55*s,xx-.23*s,yy,rgb(43,40,41),.15*s);line(g,xx+.08*s,yy-.58*s,xx+.17*s,yy-.03*s,rgb(47,42,41),.16*s);
  g.fillStyle=rgb(112,58,45);g.beginPath();g.moveTo(xx-.15*s,yy-1.48*s);g.lineTo(xx+.17*s,yy-1.42*s);g.lineTo(xx+.36*s,yy-.54*s);g.quadraticCurveTo(xx,yy-.39*s,xx-.31*s,yy-.52*s);g.closePath();g.fill();
  g.fillStyle=rgb(60,48,44);disc(g,xx+.02*s,yy-1.64*s,.18*s);line(g,xx+.32*s,yy-1.04*s,xx+.51*s,yy-.01*s,rgb(92,78,61),.11*s);
}
function birds(){
  const r=stream('gannet flight'),g=ctx;
  const flocks=[[1096,365,150,34,17,4.1],[1378,465,98,32,12,2.6],[813,265,80,31,7,3.1],[1037,543,57,16,8,2.2]];
  for(const [cx,cy,rx,ry,n,size] of flocks){
    for(let j=0;j<n;j++){
      const t=(j+.3+r()*.5)/n,x=cx+(t-.5)*rx*2,y=cy+Math.sin(t*5.6+1)*ry*.52+(r()-.5)*ry,span=(.45+r()*.82)*size,bank=(r()-.5)*1.05,up=r()*1.32-.46;
      g.save();g.translate(x,y);g.rotate(bank);
      g.fillStyle=rgb(67+r()*14,62+r()*10,68+r()*11,.61+r()*.21);g.beginPath();
      g.moveTo(-span,-up*span*.52);g.quadraticCurveTo(-span*.58,-span*.45,0,.06*span);g.quadraticCurveTo(span*.49,-span*(.14+up*.2),span,-span*(.17+up*.31));
      g.quadraticCurveTo(span*.44,-span*.02,span*.07,span*.21);g.lineTo(-span*.07,span*.2);g.quadraticCurveTo(-span*.54,-span*.24,-span,-up*span*.52);g.fill();
      if(span>3){line(g,span*.10,0,span*.63,-span*.21,rgb(229,198,157,.70),.50)}
      g.restore();
    }
  }
}
function finish(){
  const frame=ctx.getImageData(0,0,W,H),p=frame.data,color=stream('silver halides'),lut=new Uint8ClampedArray(256);
  for(let i=0;i<256;i++){const t=i/255,d=t-.5;lut[i]=255*clamp(t+d*(.92-3.68*d*d)*.27)}
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    const o=(i+j*W)*4,dx=(i-W*.51)/(W*.72),dy=(j-H*.46)/(H*.91);
    const corners=1-.054*Math.min(1.4,(dx*dx+dy*dy)*(dx*dx+dy*dy)),val=(color()+color()+color()-1.5)*2.45;
    const r=lut[p[o]],g=lut[p[o+1]],b=lut[p[o+2]],l=r*.24+g*.64+b*.12;
    p[o]=(l+(r-l)*1.10)*corners+val;p[o+1]=(l+(g-l)*1.10)*corners+val;p[o+2]=(l+(b-l)*1.10)*corners+val;
  }ctx.putImageData(frame,0,0);
}
let ready=false;
async function paint(){
  await frame('Gathering the twilight',3);makeSky();
  await frame('Raising the headlands',17);makeScene();fallingWater();
  await frame('Tracing the last sunlight',34);shadowMap();distanceToShore();
  await frame('Tracing the reflected coast',46);
  let R=raster(.55,-EYE),ref=shadeGeometry(R);compositeFalls(R,ref);R=null;
  await frame('Weathering the stone',62);
  const G=raster(1,EYE),im=shadeGeometry(G);
  // Geometry has now served both cameras. Release it before laying down the meadow.
  tris.length=0;
  await frame('Resolving the tide',76);ocean(G,im,ref);ref=null;compositeFalls(G,im);seaAir(G,im);ctx.putImageData(im,0,0);
  await frame('Growing the windward meadow',91);climbingPlants(G);ridgePlants(G);travellers(G);plants(G);birds();finish();
  ready=true;progress.value=100;status.classList.add('done');status.setAttribute('aria-hidden','true');
  document.documentElement.dataset.ready='true';setTimeout(()=>status.remove(),500);
}
function save(){
  if(!ready)return;
  cv.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Vesper_Reach_'+seedText.replace(/[^a-z0-9_-]/gi,'_').slice(0,80)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png');
}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}}
document.getElementById('save').addEventListener('click',save);document.getElementById('full').addEventListener('click',fullscreen);
cv.addEventListener('dblclick',fullscreen);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;if(e.key.toLowerCase()==='s'){e.preventDefault();save()}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}});
paint().catch(e=>{stage.textContent='The painting could not be rendered. Reload to try again.';console.error(e)});
})();
</script>
