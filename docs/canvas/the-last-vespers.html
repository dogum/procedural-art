<style>

</head>
<body><main>
<canvas id="painting" width="1920" height="1080" aria-label="The Last Vespers. A ruined Gothic abbey and ancient oaks above a Highland loch under the last sunset light and a rising full moon." aria-describedby="keys"></canvas>
<p id="status" role="status">Rendering the landscape…</p>

<script>
'use strict';
/*
 * THE LAST VESPERS
 * A deterministic Canvas 2D landscape. All offscreen surfaces start empty.

 * Append ?seed=your-seed to the file URL or ?still=1 to hold the first frame.

(() => {

const seedText=params.get('seed') || 'vespers-1049';

const screen=document.getElementById('painting'), display=screen.getContext('2d',{alpha:false});
const [world,ctx]=makeCanvas(),[mirror,reflect]=makeCanvas(W,H,true),[building,archMask]=makeCanvas(W,H,true);

// Centripetal-looking strokes and shorelines are sampled as cubic Hermite curves.

const lobe=new Float32Array(W*waterHeight),capillaries=new Int16Array(W*waterHeight);
function prepareGlitter(){

    const vertical=exp(-sq(dy/161))*(.51+.49*smooth(735,900,y));

function paintWater(t){
  const data=waterImage.data,E=environment,sc=1/32760,wave=waveData;

    }

}
const shallows=new Uint8Array(W*waterHeight),ringHeights=new Int8Array(W*waterHeight),flecks=[];
function shallowBed(){
  const n=W*waterHeight,dist=new Uint8Array(n);
  for(let y=0;y<waterHeight;y++)for(let x=0;x<W;x++){
    const i=y*W+x;dist[i]=dry[(y+waterTop)*W+x]?0:62;
    if(x)dist[i]=min(dist[i],dist[i-1]+1);if(y)dist[i]=min(dist[i],dist[i-W]+2);
  }
  for(let y=waterHeight-1;y>=0;y--)for(let x=W-1;x>=0;x--){
    const i=y*W+x;if(x<W-1)dist[i]=min(dist[i],dist[i+1]+1);if(y<waterHeight-1)dist[i]=min(dist[i],dist[i+W]+2);

  const r=stream('surface disturbances');

    }
  }

    const dx=sqrt(-2*Math.log(max(.00001,r())))*cos(TAU*r())*w;

    flecks.push({x,y,length:r.range(1.4,11.0)*(1+.4*z),alpha:p,phase:r()*TAU,rate:r.range(.55,1.35),dy:r.range(-.49,.49)});

}
function fineGlints(t){
  const g=wg;g.save();g.lineCap='round';
  for(const f of flecks){
    const q=.5+.5*cos(f.phase+f.rate*t),glow=pow(q,5)*f.alpha;

    g.lineWidth=.45+.56*q;g.strokeStyle=rgba(243,212,161,glow);

  }g.restore();

const [finishedScene,frame]=makeCanvas(),[optics,opticsG]=makeCanvas();
const toneMap=[new Uint8ClampedArray(256),new Uint8ClampedArray(256),new Uint8ClampedArray(256)];
for(let v=0;v<256;v++){
  const shadow=exp(-sq((v-62)/49)),high=exp(-sq((v-169)/58));
  toneMap[0][v]=v-12*shadow+6.4*high;toneMap[1][v]=v-10*shadow+5.0*high;toneMap[2][v]=v-7.3*shadow+3.6*high;
}
function gradePlate(g){
  const pic=g.getImageData(0,0,W,H),p=pic.data;
  for(let i=0;i<p.length;i+=4){
    if(!p[i+3])continue;const r=toneMap[0][p[i]],gr=toneMap[1][p[i+1]],b=toneMap[2][p[i+2]],l=.25*r+.57*gr+.18*b;
    p[i]=l+(r-l)*1.06;p[i+1]=l+(gr-l)*1.06;p[i+2]=l+(b-l)*1.06;
  }g.putImageData(pic,0,0);
}
function darkroom(){
  const g=opticsG;
  g.save();g.translate(W*.49,H*.47);g.scale(W*.62,H*.68);
  const v=g.createRadialGradient(0,0,.27,0,0,1.21);
  stops(v,[[0,'rgba(13,13,24,0)'],[.53,'rgba(13,13,24,0.01)'],[.82,'rgba(13,13,24,.10)'],[1,'rgba(10,11,20,.31)']]);

let motion=false,ready=false,clock=0,lastClock=0,lastWater=-1000,lastPaint=-1000,interval=115,raf=0;
function assembleFrame(t){
  paintWater(t);frame.drawImage(world,0,0);frame.drawImage(water,0,waterTop);frame.drawImage(front,0,0);frame.drawImage(halation,1285,15);
}
function show(t){

function tick(now){

async function dawn(){

dawn().catch(error=>{console.error(error);document.getElementById('status').textContent='The landscape could not finish rendering.';});
